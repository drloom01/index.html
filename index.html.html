<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovelVerse - Free Web Novels</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta+ Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- App Container -->
    <div id="app" class="flex-1 flex flex-col">
        <!-- Dynamically rendered by JavaScript -->
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        // --- REAL-TIME STORAGE SYNC LISTENER ---
        window.addEventListener('storage', function(e) {
            if (e.key === 'novelverse_users' || e.key === 'novelverse_current_user' || e.key === 'novelverse_recovery_tickets') {
                const storedUsers = getStoredData('users', []);
                if (currentUser) {
                    const latestMe = storedUsers.find(u => u.id === currentUser.id);
                    if (latestMe) {
                        currentUser = latestMe;
                        render();
                    }
                } else {
                    render();
                }
            }
        });

        // --- INITIAL DATA & STORAGE SETUP ---
        const DEFAULT_ADMIN = {
            id: 'admin_root',
            email: 'admin@novelverse.com',
            password: 'admin123',
            name: 'Supreme Admin',
            role: 'admin',
            isAuthor: true,
            isSuspended: false,
            suspendMode: 'none',
            isBlocked: false,
            warningCount: 0,
            riskGrade: 'Low',
            notifications: [{ id: 'notif_1', title: 'Welcome to NovelVerse', text: 'Welcome to NovelVerse! Explore free novels or start writing.', time: 'System Default', read: false }]
        };

        function getStoredData(key, fallback) {
            const data = localStorage.getItem('novelverse_' + key);
            return data ? JSON.parse(data) : fallback;
        }

        function setStoredData(key, data) {
            localStorage.setItem('novelverse_' + key, JSON.stringify(data));
        }

        if (!localStorage.getItem('novelverse_users')) {
            setStoredData('users', [DEFAULT_ADMIN]);
        }
        if (!localStorage.getItem('novelverse_blocked_logs')) {
            setStoredData('blocked_logs', []);
        }
        if (!localStorage.getItem('novelverse_reports')) {
            setStoredData('reports', []);
        }
        if (!localStorage.getItem('novelverse_announcements')) {
            setStoredData('announcements', [{ id: 'ann_1', title: 'Platform Launch', content: 'Welcome everyone! Dark fantasy, tragedy, and gore storylines are fully allowed.', time: 'Day 1' }]);
        }
        if (!localStorage.getItem('novelverse_comments')) {
            setStoredData('comments', []);
        }
        if (!localStorage.getItem('novelverse_recovery_tickets')) {
            setStoredData('recovery_tickets', []);
        }
        if (!localStorage.getItem('novelverse_novels')) {
            setStoredData('novels', [
                {
                    id: 'novel_1',
                    title: 'The Phantom Cultivator Chronicles',
                    authorId: 'admin_root',
                    authorName: 'Supreme Admin',
                    cover: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=500&auto=format&fit=crop&q=60',
                    genre: 'Fantasy / Martial Arts',
                    synopsis: 'In a world where spirits govern the mortal realm, a young outcast discovers a forbidden technique that defies heaven and earth.',
                    status: 'Ongoing',
                    chapters: [
                        { id: 'ch_1', title: 'Chapter 1: The Awakening of the Void', content: 'The rain poured heavily over the peaks of Mount Canglan. Lin Yi wiped the blood from his lips, staring at the shattered jade talisman in his palm...' },
                        { id: 'ch_2', title: 'Chapter 2: First Step into the Spirit Path', content: 'Circulating Qi through blocked meridians was a torturous ordeal. Every breath felt like swallowing molten iron...' }
                    ]
                }
            ]);
        }

        // --- APP STATE ---
        let currentUser = getStoredData('current_user', null);
        let currentView = getStoredData('current_view', currentUser ? 'dashboard' : 'login'); 
        let activeRole = getStoredData('active_role', 'reader');
        let selectedNovelId = getStoredData('selected_novel', null);
        let selectedChapterId = getStoredData('selected_chapter', null);
        let editingNovelId = getStoredData('editing_novel', null);
        let adminImpersonator = getStoredData('admin_impersonator', null); 
        let adminActiveTab = getStoredData('admin_tab', 'overview'); 
        let inspectedReport = getStoredData('inspected_report', null);
        let openedNotificationId = null;
        let adminUserSearchQuery = '';
        let readerNovelSearchQuery = '';
        let showForgotPasswordModal = false;
        let activeRecoveryTicketId = null;
        let showUserSettingsModal = false;
        let openDropdownUserId = null; // Tracks which user's 3-dot dropdown menu is open

        // Close dropdown when clicking outside
        window.addEventListener('click', function(e) {
            if (!e.target.closest('.dropdown-container')) {
                if (openDropdownUserId) {
                    openDropdownUserId = null;
                    render();
                }
            }
        });

        function saveState() {
            setStoredData('current_user', currentUser);
            setStoredData('current_view', currentView);
            setStoredData('active_role', activeRole);
            setStoredData('selected_novel', selectedNovelId);
            setStoredData('selected_chapter', selectedChapterId);
            setStoredData('editing_novel', editingNovelId);
            setStoredData('admin_impersonator', adminImpersonator);
            setStoredData('admin_tab', adminActiveTab);
            setStoredData('inspected_report', inspectedReport);
        }

        function navigate(view, role = null) {
            currentView = view;
            if (role) activeRole = role;
            saveState();
            render();
        }

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const pass = document.getElementById('login-password').value;

            if (email.toUpperCase() === 'DR LOOM' && pass === '123') {
                currentUser = {
                    id: 'admin_root',
                    email: 'drloom@admin.com',
                    name: 'Dr. Loom (Supreme Admin)',
                    role: 'admin',
                    isAuthor: true,
                    isSuspended: false,
                    suspendMode: 'none',
                    isBlocked: false,
                    warningCount: 0,
                    riskGrade: 'Low',
                    notifications: []
                };
                adminImpersonator = null;
                navigate('admin_home', 'admin');
                return;
            }

            const users = getStoredData('users', []);
            const user = users.find(u => u.email.toLowerCase() === email.toLowerCase() && u.password === pass);
            if (!user) {
                alert('Invalid email or password!');
                return;
            }

            if (user.isBlocked) {
                alert('🛑 ACCESS DENIED: This account has been permanently blocked by Supreme Admin.');
                return;
            }

            if (user.isSuspended && user.suspendMode === 'both') {
                alert('⚠️ This account has been fully suspended.');
                return;
            }

            currentUser = user;
            adminImpersonator = null;
            if (user.role === 'admin' || user.role === 'co-admin') {
                navigate('admin_home', 'admin');
            } else if (user.isAuthor && user.suspendMode !== 'author' && user.suspendMode !== 'both') {
                navigate('role_select');
            } else {
                navigate('reader_home', 'reader');
            }
        }

        function handleSignup(e) {
            e.preventDefault();
            const name = document.getElementById('signup-name').value.trim();
            const email = document.getElementById('signup-email').value.trim().toLowerCase();
            const pass = document.getElementById('signup-password').value;

            if (!email.endsWith('@gmail.com')) {
                alert('Please use a valid Gmail address ending with @gmail.com!');
                return;
            }

            const users = getStoredData('users', []);
            if (users.some(u => u.email === email)) {
                alert('This Gmail address is already registered!');
                return;
            }

            const newUser = {
                id: 'user_' + Date.now(),
                name,
                email,
                password: pass,
                role: 'user',
                isAuthor: false,
                isSuspended: false,
                suspendMode: 'none',
                isBlocked: false,
                warningCount: 0,
                riskGrade: 'Low',
                draftChapters: [],
                notifications: [{ id: 'notif_' + Date.now(), title: 'Welcome to NovelVerse', text: 'Welcome to NovelVerse! Your account has been successfully created.', time: new Date().toLocaleTimeString(), read: false }]
            };

            users.push(newUser);
            setStoredData('users', users);
            currentUser = newUser;
            alert('Account created successfully!');
            navigate('reader_home', 'reader');
        }

        function handleLogout() {
            if (adminImpersonator) {
                currentUser = adminImpersonator;
                adminImpersonator = null;
                navigate('admin_home', 'admin');
                return;
            }
            currentUser = null;
            activeRole = 'reader';
            adminImpersonator = null;
            navigate('login');
        }

        function handleUserPasswordChange(e) {
            e.preventDefault();
            const currentPass = document.getElementById('settings-current-pass').value;
            const newPass = document.getElementById('settings-new-pass').value;

            if (currentUser.password !== currentPass && currentUser.role !== 'admin') {
                alert('Current password is incorrect!');
                return;
            }

            let users = getStoredData('users', []);
            users = users.map(u => {
                if (u.id === currentUser.id) {
                    u.password = newPass;
                    currentUser = u;
                }
                return u;
            });
            setStoredData('users', users);
            saveState();
            showUserSettingsModal = false;
            alert('✅ Password successfully updated!');
            render();
        }

        function submitRecoveryTicket(e) {
            e.preventDefault();
            const email = document.getElementById('rec-email').value.trim().toLowerCase();
            const proof = document.getElementById('rec-proof').value.trim();

            if (!email || !proof) {
                alert('Please provide your email and proof of ownership!');
                return;
            }

            let tickets = getStoredData('recovery_tickets', []);
            const newTicket = {
                id: 'ticket_' + Date.now(),
                email,
                proof,
                status: 'Open',
                time: new Date().toLocaleString(),
                messages: [
                    { sender: 'User', text: `Hello Admin, I lost my password. Proof of ownership: ${proof}`, time: new Date().toLocaleTimeString() }
                ]
            };

            tickets.unshift(newTicket);
            setStoredData('recovery_tickets', tickets);
            showForgotPasswordModal = false;
            alert('✅ Recovery ticket submitted to DR Loom! Your temporary support chat has been opened.');
            activeRecoveryTicketId = newTicket.id;
            render();
        }

        function sendRecoveryChatMessage(e) {
            e.preventDefault();
            const input = document.getElementById('ticket-chat-input');
            const text = input.value.trim();
            if (!text) return;

            const senderName = (currentUser && currentUser.role === 'admin') ? 'DR Loom (Supreme Admin)' : 'User';

            let tickets = getStoredData('recovery_tickets', []);
            tickets = tickets.map(t => {
                if (t.id === activeRecoveryTicketId) {
                    t.messages.push({ sender: senderName, text, time: new Date().toLocaleTimeString() });
                }
                return t;
            });
            setStoredData('recovery_tickets', tickets);
            input.value = '';
            render();
        }

        function resolveRecoveryTicket(ticketId) {
            const userEmail = prompt('Enter the user email to assign a temporary password to:');
            if (!userEmail) return;
            const newTempPass = prompt('Enter the Temporary Password for this user:', 'tempPass123');
            if (!newTempPass) return;

            let users = getStoredData('users', []);
            let found = false;
            users = users.map(u => {
                if (u.email.toLowerCase() === userEmail.toLowerCase()) {
                    u.password = newTempPass;
                    if (!u.notifications) u.notifications = [];
                    u.notifications.unshift({
                        id: 'notif_' + Date.now(),
                        title: '🔑 Password Reset Successful',
                        text: `Supreme Admin has resolved your recovery ticket and reset your temporary password to: "${newTempPass}". Please log in and update it immediately in your Account Settings!`,
                        time: new Date().toLocaleString(),
                        read: false
                    });
                    found = true;
                }
                return u;
            });

            if (!found) {
                alert('User email not found in database!');
                return;
            }

            setStoredData('users', users);

            let tickets = getStoredData('recovery_tickets', []);
            tickets = tickets.map(t => {
                if (t.id === ticketId) {
                    t.status = 'Password Sent ✅';
                    t.messages.push({ sender: 'DR Loom (Supreme Admin)', text: `[SYSTEM] Your password has been successfully reset. Your temporary password is: "${newTempPass}". Please log in and change your password immediately in Account Settings!`, time: new Date().toLocaleTimeString() });
                }
                return t;
            });
            setStoredData('recovery_tickets', tickets);
            alert('Temporary password issued, ticket marked as Password Sent ✅!');
            render();
        }

        // --- MARK RECOVERY TICKET AS FINISHED ---
        function markTicketFinished(ticketId) {
            let tickets = getStoredData('recovery_tickets', []);
            tickets = tickets.map(t => {
                if (t.id === ticketId) {
                    t.status = 'Finished ✅';
                }
                return t;
            });
            setStoredData('recovery_tickets', tickets);
            alert('Recovery ticket marked as Finished ✅!');
            render();
        }

        function sendDirectPersonalMail(userId) {
            const users = getStoredData('users', []);
            const targetUser = users.find(u => u.id === userId);
            if (!targetUser) return;

            const subject = prompt(`Send Direct Mail to ${targetUser.name} (${targetUser.email})\nEnter Mail Subject:`, 'Important Notice from Supreme Admin');
            if (!subject) return;

            const message = prompt(`Enter Mail Message for ${targetUser.name}:`, 'Hello, this is a personal message from Supreme Admin.');
            if (!message) return;

            let updatedUsers = users.map(u => {
                if (u.id === userId) {
                    if (!u.notifications) u.notifications = [];
                    u.notifications.unshift({
                        id: 'notif_' + Date.now(),
                        title: `📨 Direct Mail: ${subject}`,
                        text: message,
                        time: new Date().toLocaleString(),
                        read: false
                    });
                }
                return u;
            });

            setStoredData('users', updatedUsers);

            if (currentUser && currentUser.id === userId) {
                currentUser = updatedUsers.find(u => u.id === userId);
            }

            alert(`Personal mail successfully sent and delivered to ${targetUser.name}'s mailbox!`);
            render();
        }

        function deleteReport(reportId) {
            if (!confirm('Delete this report?')) return;
            let reports = getStoredData('reports', []).filter(r => r.id !== reportId);
            setStoredData('reports', reports);
            alert('Report dismissed and deleted.');
            render();
        }

        function deleteUserCompletely(userId) {
            const users = getStoredData('users', []);
            const targetUser = users.find(u => u.id === userId);
            if (!targetUser) return;

            if (!confirm(`🛑 WARNING: Are you sure you want to permanently DELETE user "${targetUser.name}" (${targetUser.email})? This will completely wipe their account and all associated novels/comments from the database.`)) return;

            const updatedUsers = users.filter(u => u.id !== userId);
            setStoredData('users', updatedUsers);

            let novels = getStoredData('novels', []).filter(n => n.authorId !== userId);
            setStoredData('novels', novels);

            let comments = getStoredData('comments', []).filter(c => c.userId !== userId);
            setStoredData('comments', comments);

            alert(`User "${targetUser.name}" has been permanently deleted from NovelVerse.`);
            render();
        }

        function stealthInspectUser(userId) {
            const users = getStoredData('users', []);
            const targetUser = users.find(u => u.id === userId);
            if (!targetUser) {
                alert('User not found!');
                return;
            }

            adminImpersonator = currentUser;
            currentUser = targetUser;
            activeRole = targetUser.isAuthor ? 'author' : 'reader';
            navigate('reader_home', activeRole);
        }

        function manualSuspendUser(userId) {
            const choice = prompt('Select suspension mode for this user:\n1 = Suspend Reader Mode Only\n2 = Suspend Author Studio Only\n3 = Suspend Both (Full Suspension)', '3');
            if (!choice) return;

            let mode = 'both';
            if (choice === '1') mode = 'reader';
            else if (choice === '2') mode = 'author';

            let users = getStoredData('users', []);
            users = users.map(u => {
                if (u.id === userId) {
                    u.isSuspended = true;
                    u.suspendMode = mode;
                    if (!u.notifications) u.notifications = [];
                    u.notifications.unshift({
                        id: 'notif_' + Date.now(),
                        title: '⚠️ Account Restriction Notice',
                        text: `Supreme Admin has manually restricted your account mode: [${mode.toUpperCase()}].`,
                        time: new Date().toLocaleString(),
                        read: false
                    });
                }
                return u;
            });
            setStoredData('users', users);
            alert(`User successfully suspended under mode: ${mode.toUpperCase()}`);
            render();
        }

        function unsuspendUser(userId) {
            if (!confirm('Lift all suspensions for this user?')) return;
            let users = getStoredData('users', []);
            users = users.map(u => {
                if (u.id === userId) {
                    u.isSuspended = false;
                    u.suspendMode = 'none';
                    u.warningCount = 0;
                    u.riskGrade = 'Low';
                    if (!u.notifications) u.notifications = [];
                    u.notifications.unshift({
                        id: 'notif_' + Date.now(),
                        title: '✅ Suspension Lifted',
                        text: 'Supreme Admin has fully restored your account permissions and cleared your restrictions.',
                        time: new Date().toLocaleString(),
                        read: false
                    });
                }
                return u;
            });
            setStoredData('users', users);
            alert('User suspension lifted successfully!');
            render();
        }

        function blockUserPermanently(userId) {
            if (!confirm('🛑 WARNING: This will permanently block this user, freeze their login, and delete all their novels/comments. Proceed?')) return;
            let users = getStoredData('users', []);
            users = users.map(u => {
                if (u.id === userId) {
                    u.isBlocked = true;
                    u.isSuspended = true;
                    u.suspendMode = 'both';
                    if (!u.notifications) u.notifications = [];
                    u.notifications.unshift({
                        id: 'notif_' + Date.now(),
                        title: '🛑 Permanent Account Ban',
                        text: 'Your account has been permanently blocked by Supreme Admin due to policy violations.',
                        time: new Date().toLocaleString(),
                        read: false
                    });
                }
                return u;
            });
            setStoredData('users', users);

            let novels = getStoredData('novels', []).filter(n => n.authorId !== userId);
            setStoredData('novels', novels);
            alert('User permanently blocked and content purged.');
            render();
        }

        function unblockUser(userId) {
            if (!confirm('Unblock this user account?')) return;
            let users = getStoredData('users', []);
            users = users.map(u => {
                if (u.id === userId) {
                    u.isBlocked = false;
                    u.isSuspended = false;
                    u.suspendMode = 'none';
                    if (!u.notifications) u.notifications = [];
                    u.notifications.unshift({
                        id: 'notif_' + Date.now(),
                        title: '✅ Account Unblocked',
                        text: 'Supreme Admin has unblocked your account. You can now log in normally.',
                        time: new Date().toLocaleString(),
                        read: false
                    });
                }
                return u;
            });
            setStoredData('users', users);
            alert('User account unblocked!');
            render();
        }

        function manualLowerRisk(userId) {
            const gradeChoice = prompt('Select new Risk Grade for this user:\n1 = Low\n2 = Moderate\n3 = High', '1');
            if (!gradeChoice) return;

            let newRisk = 'Low';
            let newWarnings = 0;
            if (gradeChoice === '2') { newRisk = 'Moderate'; newWarnings = 3; }
            else if (gradeChoice === '3') { newRisk = 'High'; newWarnings = 6; }

            let users = getStoredData('users', []);
            users = users.map(u => {
                if (u.id === userId) {
                    u.riskGrade = newRisk;
                    u.warningCount = newWarnings;
                    if (!u.notifications) u.notifications = [];
                    u.notifications.unshift({
                        id: 'notif_' + Date.now(),
                        title: '🛡️ Risk Level Adjusted',
                        text: `Supreme Admin has manually adjusted your account risk level to [${newRisk} Risk].`,
                        time: new Date().toLocaleString(),
                        read: false
                    });
                }
                return u;
            });
            setStoredData('users', users);
            alert(`User risk successfully updated to ${newRisk}!`);
            render();
        }

        function recoverUserPassword(userId) {
            const users = getStoredData('users', []);
            const target = users.find(u => u.id === userId);
            if (!target) return;

            const newPass = prompt(`Password Recovery for "${target.name}" (${target.email})\nEnter a new password for this user:`, 'newpassword123');
            if (!newPass) return;

            let updatedUsers = users.map(u => {
                if (u.id === userId) {
                    u.password = newPass;
                    if (!u.notifications) u.notifications = [];
                    u.notifications.unshift({
                        id: 'notif_' + Date.now(),
                        title: '🔑 Password Reset By Admin',
                        text: `Supreme Admin has manually reset your account password. Your new temporary password is: "${newPass}". Please change it in your Account Settings.`,
                        time: new Date().toLocaleString(),
                        read: false
                    });
                }
                return u;
            });
            setStoredData('users', updatedUsers);
            alert(`Password successfully reset for ${target.name}.\nNew Password: ${newPass}`);
            render();
        }

        function submitReport(targetType, targetId, targetName, authorId = '', authorName = '') {
            const reason = prompt(`Reason for reporting this ${targetType} ("${targetName}"):`);
            if (!reason) return;

            if (!authorName || authorName === 'Unknown') {
                const novels = getStoredData('novels', []);
                const foundNovel = novels.find(n => n.id === targetId || n.title === targetName);
                if (foundNovel) {
                    authorName = foundNovel.authorName;
                    authorId = foundNovel.authorId;
                }
            }

            let reports = getStoredData('reports', []);
            reports.unshift({
                id: 'rep_' + Date.now(),
                reporterName: currentUser.name,
                targetType,
                targetId,
                targetName,
                authorId,
                authorName: authorName || 'Unknown',
                reason,
                time: new Date().toLocaleString()
            });
            setStoredData('reports', reports);
            alert(`Report submitted successfully to admins.`);
            render();
        }

        function sendWarningMail(userId) {
            const warningBody = prompt('Enter official warning message for this user:');
            if (!warningBody) return;

            let users = getStoredData('users', []);
            users = users.map(u => {
                if (u.id === userId) {
                    u.warningCount = (u.warningCount || 0) + 1;

                    if (u.warningCount >= 6) {
                        u.riskGrade = 'High';
                        u.isSuspended = true;
                        u.suspendMode = 'both';
                    } else if (u.warningCount === 5) {
                        u.riskGrade = 'Moderate';
                    } else if (u.warningCount === 3) {
                        u.riskGrade = 'Moderate';
                    } else if (u.warningCount < 3) {
                        u.riskGrade = 'Low';
                    }

                    if (!u.notifications) u.notifications = [];
                    
                    let penaltyText = '';
                    if (u.warningCount === 3) penaltyText = '\n\n⚠️ PENALTY: Your account has received a warning strike.';
                    if (u.warningCount >= 6) penaltyText = '\n\n🛑 HIGH RISK PENALTY: Your account has been fully restricted.';

                    const fullMessage = `${warningBody}${penaltyText}`;

                    u.notifications.unshift({
                        id: 'notif_' + Date.now(),
                        title: `⚠️ OFFICIAL WARNING (Warning #${u.warningCount})`,
                        text: fullMessage,
                        time: new Date().toLocaleString(),
                        read: false
                    });
                }
                return u;
            });

            setStoredData('users', users);
            alert('Warning mail sent with template signature DR Loom!');
            render();
        }

        function postAnnouncement(e) {
            e.preventDefault();
            const title = document.getElementById('ann-title').value;
            const content = document.getElementById('ann-content').value;

            const announcements = getStoredData('announcements', []);
            announcements.unshift({
                id: 'ann_' + Date.now(),
                title,
                content,
                time: new Date().toLocaleString()
            });
            setStoredData('announcements', announcements);

            let users = getStoredData('users', []);
            users = users.map(u => {
                if (!u.notifications) u.notifications = [];
                u.notifications.unshift({
                    id: 'notif_' + Date.now(),
                    title: `📢 Announcement: ${title}`,
                    text: content,
                    time: new Date().toLocaleTimeString(),
                    read: false
                });
                return u;
            });
            setStoredData('users', users);

            alert('Announcement posted successfully!');
            document.getElementById('ann-title').value = '';
            document.getElementById('ann-content').value = '';
            render();
        }

        function deleteNovel(novelId) {
            if (!confirm('Delete this novel?')) return;
            let novels = getStoredData('novels', []);
            novels = novels.filter(n => n.id !== novelId);
            setStoredData('novels', novels);
            render();
        }

        function openNotificationModal(notifId) {
            openedNotificationId = notifId;
            if (currentUser && currentUser.notifications) {
                currentUser.notifications = currentUser.notifications.map(n => {
                    if (n.id === notifId) n.read = true;
                    return n;
                });
                let users = getStoredData('users', []);
                users = users.map(u => {
                    if (u.id === currentUser.id) u.notifications = currentUser.notifications;
                    return u;
                });
                setStoredData('users', users);
                saveState();
            }
            render();
        }

        function render() {
            const app = document.getElementById('app');
            app.innerHTML = '';

            if (currentView === 'login') app.innerHTML = renderLogin();
            else if (currentView === 'signup') app.innerHTML = renderSignup();
            else if (currentView === 'role_select') app.innerHTML = renderRoleSelect();
            else if (currentView === 'reader_home') app.innerHTML = renderReaderHome();
            else if (currentView === 'reader_novel') app.innerHTML = renderReaderNovel();
            else if (currentView === 'reader_read') app.innerHTML = renderReaderRead();
            else if (currentView === 'author_home') app.innerHTML = renderAuthorHome();
            else if (currentView === 'author_edit') app.innerHTML = renderAuthorEdit();
            else if (currentView === 'admin_home') app.innerHTML = renderAdminHome();
            else if (currentView === 'mailbox') app.innerHTML = renderMailbox();
        }

        function renderNavbar() {
            if (!currentUser) return '';
            const isAdmin = currentUser.role === 'admin' || currentUser.role === 'co-admin';
            const logoDestination = isAdmin ? 'admin_home' : (activeRole === 'author' && currentUser.suspendMode !== 'author' && currentUser.suspendMode !== 'both' ? 'author_home' : 'reader_home');
            const showSwitch = currentUser.isAuthor && !isAdmin && currentUser.suspendMode !== 'author' && currentUser.suspendMode !== 'both' && !adminImpersonator;
            const unreadCount = (currentUser.notifications || []).filter(n => !n.read).length;

            return `
                ${adminImpersonator ? `
                    <div class="bg-amber-600 text-slate-950 px-4 py-2 text-xs font-black flex justify-between items-center shadow-lg">
                        <span>👻 GHOST MODE ACTIVE: You are currently viewing as <b>${currentUser.name}</b> (${currentUser.email}).</span>
                        <button onclick="handleLogout()" class="bg-slate-950 text-white px-3 py-1 rounded text-[11px] hover:bg-slate-900 transition font-bold">Exit Ghost Mode 🚪</button>
                    </div>
                ` : ''}
                <nav class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex justify-between items-center sticky top-0 z-50">
                    <div class="flex items-center space-x-3 cursor-pointer" onclick="navigate('${logoDestination}')">
                        <i class="fa-solid fa-book-open-reader text-indigo-500 text-2xl"></i>
                        <span class="text-xl font-bold bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent">NovelVerse</span>
                        <span class="text-xs px-2 py-0.5 rounded bg-slate-800 text-slate-400 uppercase font-semibold">${isAdmin ? currentUser.role : activeRole} mode</span>
                    </div>
                    <div class="flex items-center space-x-4">
                        <button onclick="navigate('mailbox')" class="relative bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg text-xs transition flex items-center space-x-1.5">
                            <i class="fa-solid fa-envelope text-indigo-400"></i>
                            <span class="hidden md:inline">Mailbox</span>
                            ${unreadCount > 0 ? `<span class="bg-indigo-600 text-white text-[10px] px-1.5 py-0.2 rounded-full font-bold">${unreadCount}</span>` : ''}
                        </button>
                        <button onclick="showUserSettingsModal = true; render();" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg text-xs transition flex items-center space-x-1.5">
                            <i class="fa-solid fa-gear text-slate-400"></i>
                            <span class="hidden md:inline">Settings</span>
                        </button>
                        <span class="text-sm text-slate-300 hidden md:inline">Hello, <b>${currentUser.name}</b></span>
                        ${showSwitch ? `
                            <button onclick="navigate('${activeRole === 'reader' ? 'author_home' : 'reader_home'}', '${activeRole === 'reader' ? 'author' : 'reader'}')" class="text-xs bg-indigo-600/30 border border-indigo-500 text-indigo-300 px-3 py-1.5 rounded-lg hover:bg-indigo-600/50 transition">
                                <i class="fa-solid fa-rotate mr-1"></i> Switch
                            </button>
                        ` : ''}
                        <button onclick="handleLogout()" class="text-xs ${adminImpersonator ? 'bg-amber-600 text-white font-bold' : 'bg-red-500/20 text-red-400 border border-red-500/30 hover:bg-red-500/30'} px-3 py-1.5 rounded-lg transition">
                            <i class="fa-solid ${adminImpersonator ? 'fa-ghost' : 'fa-arrow-right-from-bracket'} mr-1"></i> ${adminImpersonator ? 'Exit Ghost' : 'Logout'}
                        </button>
                    </div>
                </nav>

                <!-- USER ACCOUNT SETTINGS MODAL -->
                ${showUserSettingsModal ? `
                    <div class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl w-full max-w-md relative shadow-2xl">
                            <button onclick="showUserSettingsModal = false; render();" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
                            <h3 class="text-xl font-bold text-white mb-1"><i class="fa-solid fa-user-gear text-indigo-400 mr-2"></i> Account Settings</h3>
                            <p class="text-xs text-slate-400 mb-6">Update your account password securely.</p>

                            <form onsubmit="handleUserPasswordChange(event)" class="space-y-4">
                                <div>
                                    <label class="block text-xs font-semibold text-slate-400 mb-1">Current Password (or Temp Password)</label>
                                    <input type="password" id="settings-current-pass" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white text-xs">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-slate-400 mb-1">New Password</label>
                                    <input type="password" id="settings-new-pass" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white text-xs">
                                </div>
                                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold py-2.5 rounded-lg">Save New Password</button>
                            </form>
                        </div>
                    </div>
                ` : ''}
            `;
        }

        function renderMailbox() {
            const notifs = currentUser.notifications || [];
            const isAdmin = currentUser.role === 'admin' || currentUser.role === 'co-admin';
            const backDest = isAdmin ? 'admin_home' : (activeRole === 'author' && currentUser.suspendMode !== 'author' && currentUser.suspendMode !== 'both' ? 'author_home' : 'reader_home');
            const activeNotif = notifs.find(n => n.id === openedNotificationId);

            return `
                ${renderNavbar()}
                <div class="flex-1 max-w-3xl w-full mx-auto px-6 py-8">
                    <button onclick="navigate('${backDest}')" class="text-sm text-indigo-400 hover:underline mb-6 inline-block">
                        <i class="fa-solid fa-arrow-left mr-1"></i> Back

                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 mb-6">
                        <h1 class="text-2xl font-bold text-white mb-1"><i class="fa-solid fa-inbox text-indigo-400 mr-2"></i> User Mailbox & Notifications</h1>
                        <p class="text-xs text-slate-400">Click any message to open the full notice and mark it as read.</p>
                    </div>

                    ${activeNotif ? `
                        <div class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div class="bg-slate-900 border border-indigo-500/50 p-6 rounded-2xl w-full max-w-lg relative shadow-2xl">
                                <button onclick="openedNotificationId = null; render();" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
                                <span class="text-[10px] uppercase font-bold text-indigo-400 tracking-wider">Official Message</span>
                                <h3 class="text-xl font-bold text-white mt-1 mb-4">${activeNotif.title || 'System Notification'}</h3>
                                
                                <div class="space-y-4 text-sm bg-slate-950 p-5 rounded-xl border border-slate-800 text-slate-200 leading-relaxed whitespace-pre-line">
                                    ${activeNotif.text}
                                    
                                    <div class="pt-4 mt-4 border-t border-slate-800/80 flex flex-col items-end">
                                        <span class="text-xs text-slate-400 italic">Best regards,</span>
                                        <span class="text-sm font-bold text-indigo-300 mt-0.5">DR Loom</span>
                                        <span class="text-[10px] text-slate-500 uppercase tracking-widest">Supreme Admin</span>
                                    </div>
                                </div>

                                <div class="mt-6 flex justify-between items-center">
                                    <span class="text-[10px] text-slate-500">${activeNotif.time}</span>
                                    <button onclick="openedNotificationId = null; render();" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-5 py-2.5 rounded-lg font-semibold">Close</button>
                                </div>
                            </div>
                        </div>
                    ` : ''}

                    <div class="space-y-3">
                        ${notifs.length === 0 ? '<p class="text-slate-500 text-sm italic">Your mailbox is empty.</p>' : ''}
                        ${notifs.map(n => `
                            <div onclick="openNotificationModal('${n.id}')" class="bg-slate-900 border ${n.read ? 'border-slate-800 opacity-75' : 'border-indigo-500/60 bg-indigo-950/20'} p-4 rounded-xl flex justify-between items-center cursor-pointer hover:border-indigo-400 transition">
                                <div class="flex items-start space-x-3">
                                    ${!n.read ? '<span class="h-2.5 w-2.5 rounded-full bg-indigo-500 mt-1.5 flex-shrink-0 animate-pulse"></span>' : '<span class="h-2.5 w-2.5 rounded-full bg-slate-700 mt-1.5 flex-shrink-0"></span>'}
                                    <div>
                                        <h4 class="text-sm font-bold text-white">${n.title || 'Notification'}</h4>
                                        <p class="text-xs text-slate-300 mt-1 line-clamp-1">${n.text}</p>
                                        <span class="text-[10px] text-slate-500 mt-1 block">${n.time}</span>
                                    </div>
                                </div>
                                <span class="text-xs text-indigo-400 font-semibold bg-indigo-950 px-3 py-1.5 rounded-lg border border-indigo-800/50 flex-shrink-0">View</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderLogin() {
            const tickets = getStoredData('recovery_tickets', []);
            const currentActiveTicket = tickets.find(t => t.id === activeRecoveryTicketId);

            return `
                <div class="flex-1 flex items-center justify-center p-6 bg-gradient-to-br from-slate-950 via-slate-900 to-indigo-950 relative">
                    
                    ${showForgotPasswordModal ? `
                        <div class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div class="bg-slate-900 border border-indigo-500/50 p-6 rounded-2xl w-full max-w-md relative shadow-2xl">
                                <button onclick="showForgotPasswordModal = false; render();" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
                                <h3 class="text-xl font-bold text-white mb-1"><i class="fa-solid fa-key text-indigo-400 mr-2"></i> Password Recovery Desk</h3>
                                <p class="text-xs text-slate-400 mb-4">Submit your account email and ownership proof to contact DR Loom.</p>
                                
                                <form onsubmit="submitRecoveryTicket(event)" class="space-y-3">
                                    <div>
                                        <label class="block text-xs font-semibold text-slate-400 mb-1">Your Account Email</label>
                                        <input type="email" id="rec-email" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white text-xs" placeholder="you@gmail.com">
                                    </div>
                                    <div>
                                        <label class="block text-xs font-semibold text-slate-400 mb-1">Proof of Ownership / Details</label>
                                        <textarea id="rec-proof" rows="3" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white text-xs" placeholder="Describe your account details, previous novels, or attach proof description..."></textarea>
                                    </div>
                                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold py-2.5 rounded-lg">Submit to DR Loom</button>
                                </form>
                            </div>
                        </div>
                    ` : ''}

                    ${activeRecoveryTicketId && currentActiveTicket ? `
                        <div class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div class="bg-slate-900 border border-indigo-500/50 p-6 rounded-2xl w-full max-w-lg relative shadow-2xl flex flex-col h-[500px]">
                                <button onclick="activeRecoveryTicketId = null; render();" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
                                <h3 class="text-lg font-bold text-white mb-1"><i class="fa-solid fa-comments text-indigo-400 mr-2"></i> Recovery Support Chat</h3>
                                <p class="text-xs text-slate-400 mb-4">Status: <span class="font-bold ${currentActiveTicket.status.includes('Password Sent') ? 'text-emerald-400' : 'text-amber-400'}">${currentActiveTicket.status}</span></p>

                                <div class="flex-1 bg-slate-950 border border-slate-800 rounded-xl p-4 overflow-y-auto space-y-3 mb-4">
                                    ${currentActiveTicket.messages.map(m => `
                                        <div class="p-2.5 rounded-lg text-xs ${m.sender.includes('DR Loom') ? 'bg-indigo-950/60 border border-indigo-800 text-indigo-200' : 'bg-slate-900 text-slate-300'}">
                                            <div class="flex justify-between items-center mb-1">
                                                <span class="font-bold">${m.sender}</span>
                                                <span class="text-[10px] text-slate-500">${m.time}</span>
                                            </div>
                                            <p>${m.text}</p>
                                        </div>
                                    `).join('')}
                                </div>

                                ${!currentActiveTicket.status.includes('Password Sent') ? `
                                    <form onsubmit="sendRecoveryChatMessage(event)" class="flex space-x-2">
                                        <input type="text" id="ticket-chat-input" required placeholder="Type message or proof details..." class="flex-1 bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white text-xs">
                                        <button type="submit" class="bg-indigo-600 text-white text-xs px-4 py-2 rounded-lg font-bold">Send</button>
                                    </form>
                                ` : `
                                    <div class="text-center text-xs text-emerald-400 font-bold bg-emerald-950/30 p-2 rounded border border-emerald-800">
                                        Password Sent! Ticket resolved. You can now log in.
                                    </div>
                                `}
                            </div>
                        </div>
                    ` : ''}

                    <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl w-full max-w-md shadow-2xl">
                        <div class="text-center mb-6">
                            <i class="fa-solid fa-book-sparkles text-indigo-500 text-4xl mb-2"></i>
                            <h1 class="text-2xl font-bold text-white">Welcome Back</h1>
                        </div>
                        <form onsubmit="handleLogin(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-400 mb-1">Email Address</label>
                                <input type="text" id="login-email" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-white" placeholder="you@gmail.com">
                            </div>
                            <div>
                                <div class="flex justify-between items-center mb-1">
                                    <label class="block text-xs font-semibold text-slate-400">Password</label>
                                    <button type="button" onclick="showForgotPasswordModal = true; render();" class="text-xs text-indigo-400 hover:underline">Forgot password?</button>
                                </div>
                                <input type="password" id="login-password" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-white" placeholder="••••••••">
                            </div>
                            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 rounded-lg transition">Login</button>
                        </form>

                        ${tickets.length > 0 ? `
                            <div class="mt-4 pt-4 border-t border-slate-800 text-center">
                                <span class="text-xs text-slate-400">Submitted a recovery ticket? </span>
                                <button onclick="activeRecoveryTicketId = '${tickets[0].id}'; render();" class="text-xs text-indigo-400 font-bold hover:underline">Open Active Chat</button>
                            </div>
                        ` : ''}

                        <div class="mt-6 text-center text-sm text-slate-400">
                            Don't have an account? <button onclick="navigate('signup')" class="text-indigo-400 hover:underline font-medium">Sign up</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderSignup() {
            return `
                <div class="flex-1 flex items-center justify-center p-6 bg-gradient-to-br from-slate-950 via-slate-900 to-indigo-950">
                    <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl w-full max-w-md shadow-2xl">
                        <div class="text-center mb-8">
                            <i class="fa-solid fa-user-pen text-indigo-500 text-4xl mb-2"></i>

                        <form onsubmit="handleSignup(event)" class="space-y-4">

                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-400 mb-1">Gmail Address</label>

                                <label class="block text-xs font-semibold text-slate-400 mb-1">Password</label>
                                <input type="password" id="signup-password" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-white">
                            </div>
                            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 rounded-lg transition">Sign Up</button>

                        <div class="mt-6 text-center text-sm text-slate-400">

                        </div>
                    </div>
                </div>
            `;
        }

        function renderRoleSelect() {
            if (currentUser.suspendMode === 'author' || currentUser.suspendMode === 'both') {
                navigate('reader_home', 'reader');
                return '';
            }
            return `
                <div class="flex-1 flex items-center justify-center p-6 bg-gradient-to-br from-slate-950 via-slate-900 to-indigo-950">
                    <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl w-full max-w-lg text-center shadow-2xl">
                        <h1 class="text-2xl font-bold text-white mb-2">Welcome Back, ${currentUser.name}!</h1>
                        <p class="text-slate-400 text-sm mb-8">Choose how to enter NovelVerse:</p>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <button onclick="navigate('reader_home', 'reader')" class="p-6 bg-slate-950 border border-slate-800 hover:border-indigo-500 rounded-xl transition text-left group">
                                <i class="fa-solid fa-book-open text-indigo-400 text-2xl mb-3"></i>
                                <h3 class="font-bold text-white">Enter as Reader</h3>
                            </button>
                            <button onclick="navigate('author_home', 'author')" class="p-6 bg-slate-950 border border-slate-800 hover:border-purple-500 rounded-xl transition text-left group">
                                <i class="fa-solid fa-pen-nib text-purple-400 text-2xl mb-3"></i>
                                <h3 class="font-bold text-white">Enter as Author</h3>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderReaderHome() {
            if (currentUser.suspendMode === 'reader' || currentUser.suspendMode === 'both') {
                return `
                    ${renderNavbar()}
                    <div class="flex-1 max-w-3xl w-full mx-auto px-6 py-16 text-center">
                        <div class="bg-red-500/10 border border-red-500/30 p-8 rounded-2xl">
                            <i class="fa-solid fa-ban text-red-400 text-4xl mb-4"></i>
                            <h1 class="text-2xl font-bold text-white mb-2">Reader Mode Suspended</h1>
                            <p class="text-slate-300 text-sm">Your reader access has been restricted by Supreme Admin.</p>
                        </div>
                    </div>
                `;
            }
            const novels = getStoredData('novels', []);
            const announcements = getStoredData('announcements', []);
            const isAdmin = currentUser && (currentUser.role === 'admin' || currentUser.role === 'co-admin');

            const filteredNovels = novels.filter(n => 
                n.title.toLowerCase().includes(readerNovelSearchQuery.toLowerCase()) ||
                n.genre.toLowerCase().includes(readerNovelSearchQuery.toLowerCase()) ||
                n.authorName.toLowerCase().includes(readerNovelSearchQuery.toLowerCase())
            );

            return `
                ${renderNavbar()}
                <div class="flex-1 max-w-6xl w-full mx-auto px-6 py-8">
                    ${isAdmin ? `
                        <div class="mb-6">
                            <button onclick="navigate('admin_home')" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold px-4 py-2 rounded-lg transition inline-flex items-center space-x-2">
                                <i class="fa-solid fa-arrow-left"></i>
                                <span>← Back to Admin Dashboard</span>
                            </button>
                        </div>
                    ` : ''}

                    ${announcements.length > 0 ? `
                        <div class="bg-indigo-950/40 border border-indigo-800/50 rounded-xl p-4 mb-8 flex items-center space-x-3">
                            <i class="fa-solid fa-bullhorn text-indigo-400 text-xl"></i>
                            <div class="flex-1">
                                <span class="text-xs font-bold text-indigo-400 uppercase">Announcement</span>
                                <p class="text-sm font-bold text-white">${announcements[0].title}</p>
                                <p class="text-xs text-slate-300">${announcements[0].content}</p>
                            </div>
                        </div>
                    ` : ''}

                    <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
                        <h1 class="text-3xl font-bold text-white">Explore Free Novels</h1>
                        <div class="w-full md:w-80 relative">
                            <i class="fa-solid fa-search absolute left-3.5 top-3 text-slate-400 text-sm"></i>
                            <input type="text" value="${readerNovelSearchQuery}" oninput="readerNovelSearchQuery = this.value; render();" placeholder="Search by title, genre, or author..." class="w-full bg-slate-900 border border-slate-800 rounded-xl pl-10 pr-4 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                        ${filteredNovels.length === 0 ? '<p class="text-slate-500 text-sm italic col-span-full">No novels found matching your search.</p>' : ''}
                        ${filteredNovels.map(novel => `
                            <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden group flex flex-col justify-between">

        function renderReaderRead() {
            const novels = getStoredData('novels', []);

            if (!novel) return renderReaderHome();

            const chapter = novel.chapters[chapterIndex];
            if (!chapter) return renderReaderNovel();

            const comments = getStoredData('comments', []).filter(c => c.chapterId === chapter.id);

            const prevChapter = chapterIndex > 0 ? novel.chapters[chapterIndex - 1] : null;
            const nextChapter = chapterIndex < novel.chapters.length - 1 ? novel.chapters[chapterIndex + 1] : null;

            return `
                ${renderNavbar()}

                                <span>Previous Chapter</span>
                            </button>

                        ${nextChapter ? `
                            <button onclick="selectedChapterId = '${nextChapter.id}'; render(); window.scrollTo(0,0);" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-4 py-2.5 rounded-lg transition flex items-center space-x-2 ml-auto">
                                <span>Next Chapter</span>
                                <i class="fa-solid fa-chevron-right"></i>
                            </button>
                        ` : '<span class="text-xs text-slate-500 italic ml-auto">You have reached the latest chapter</span>'}
                    </div>

                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6">

                        <form onsubmit="postComment(event)" class="mb-6 space-y-3">
                            <textarea id="comment-text" rows="2" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-white text-sm focus:outline-none focus:border-indigo-500" placeholder="Share your thoughts on this chapter..."></textarea>
                            <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-4 py-2 rounded-lg transition">Post Comment</button>
                        </form>
                        <div class="space-y-3">
                            ${comments.length === 0 ? '<p class="text-slate-500 text-sm italic">No comments yet.</p>' : ''}

                                    </div>
                                    <p class="text-xs text-slate-300">${c.text}</p>
                                    ${c.reply ? `
                                        <div class="mt-2.5 bg-indigo-950/40 border border-indigo-800/40 p-2.5 rounded-lg">

                        <div class="space-y-3">
                            ${myNovelComments.length === 0 ? '<p class="text-slate-500 text-sm italic">No reader comments on your chapters yet.</p>' : ''}
                            ${myNovelComments.map(c => `
                                <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl flex justify-between items-start">

                                        <span class="text-xs font-bold text-indigo-300">${c.userName}</span>

                                <div class="flex justify-between items-center">
                                    ${activeReport.targetType === 'Novel' || activeReport.targetType === 'Chapter' ? `
                                        <button onclick="inspectedReport = null; selectedNovelId = '${activeReport.targetId}'; navigate('reader_novel');" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-4 py-2 rounded-lg font-medium">
                                            Go Straight to Novel →
                                        </button>
                                    ` : '<span></span>'}
                                    <button onclick="inspectedReport = null; render();" class="bg-slate-800 text-white text-xs px-4 py-2 rounded-lg">Close</button>
                                </div>
                            </div>
                        </div>
                    ` : ''}

                    ${adminActiveTab === 'overview' ? `
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                            <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl">
                                <span class="text-xs text-slate-400 font-semibold">Total Users</span>
                                <h3 class="text-3xl font-bold text-white mt-2">${regularUsers.length}</h3>
                            </div>
                            <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl">
                                <span class="text-xs text-slate-400 font-semibold">Published Novels</span>
                                <h3 class="text-3xl font-bold text-white mt-2">${novels.length}</h3>
                            </div>
                            <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl">
                                <span class="text-xs text-slate-400 font-semibold">User Reports</span>
                                <h3 class="text-3xl font-bold text-red-400 mt-2">${reports.length}</h3>
                            </div>
                        </div>
                    ` : ''}

                    ${adminActiveTab === 'users' ? `
                        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-6">
                            <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                                <h2 class="text-lg font-bold text-white">Supreme User & Risk Management</h2>
                                <div class="w-full md:w-80 relative">
                                    <i class="fa-solid fa-search absolute left-3.5 top-3 text-slate-400 text-sm"></i>
                                    <input type="text" value="${adminUserSearchQuery}" oninput="adminUserSearchQuery = this.value; render();" placeholder="Search user name or email..." class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-10 pr-4 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                                </div>
                            </div>

                            <div class="space-y-3">
                                <h3 class="text-xs font-bold uppercase tracking-wider text-emerald-400"><i class="fa-solid fa-shield-check mr-1"></i> Low Risk Users (${lowRiskUsers.length})</h3>
                                ${lowRiskUsers.map(u => renderUserCard(u, novels)).join('')}
                            </div>
                            <div class="space-y-3 pt-4 border-t border-slate-800">
                                <h3 class="text-xs font-bold uppercase tracking-wider text-amber-400"><i class="fa-solid fa-triangle-exclamation mr-1"></i> Moderate Risk Users (${moderateRiskUsers.length})</h3>
                                ${moderateRiskUsers.map(u => renderUserCard(u, novels)).join('')}
                            </div>
                            <div class="space-y-3 pt-4 border-t border-slate-800">
                                <h3 class="text-xs font-bold uppercase tracking-wider text-red-400"><i class="fa-solid fa-ban mr-1"></i> High Risk Users (${highRiskUsers.length})</h3>
                                ${highRiskUsers.map(u => renderUserCard(u, novels)).join('')}
                            </div>
                        </div>
                    ` : ''}

                    ${adminActiveTab === 'recovery' ? `
                        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
                            <h2 class="text-lg font-bold text-white mb-4"><i class="fa-solid fa-key text-indigo-400 mr-2"></i> Password Recovery Desk (${recoveryTickets.length})</h2>
                            <div class="space-y-3">
                                ${recoveryTickets.length === 0 ? '<p class="text-slate-500 text-sm italic">No recovery requests submitted.</p>' : ''}
                                ${recoveryTickets.map(t => `
                                    <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl flex justify-between items-center">
                                        <div>
                                            <span class="text-xs px-2 py-0.5 rounded ${t.status.includes('Password Sent') || t.status.includes('Finished') ? 'bg-emerald-950 text-emerald-400' : 'bg-amber-950 text-amber-400'} font-bold uppercase">${t.status}</span>
                                            <h4 class="text-sm font-bold text-white mt-1">Email: ${t.email}</h4>
                                            <p class="text-xs text-slate-300 mt-1"><b>Proof:</b> "${t.proof}"</p>
                                            <span class="text-[10px] text-slate-500 mt-1 block">${t.time}</span>
                                        </div>
                                        <div class="flex space-x-2 items-center">
                                            ${!t.status.includes('Finished') ? `
                                                <button onclick="markTicketFinished('${t.id}')" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3 py-2 rounded-lg font-bold">
                                                    Mark as Finished ✅
                                                </button>
                                            ` : ''}
                                            <button onclick="activeRecoveryTicketId = '${t.id}'; render();" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-3 py-2 rounded-lg font-bold">
                                                Open Chat & Resolve →
                                            </button>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    ` : ''}

                    ${adminActiveTab === 'content' ? `
                        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
                            <h2 class="text-lg font-bold text-white mb-4"><i class="fa-solid fa-flag text-red-400 mr-2"></i> User Reports (${reports.length})</h2>
                            <div class="space-y-3">
                                ${reports.length === 0 ? '<p class="text-slate-500 text-sm italic">No user reports submitted.</p>' : ''}
                                ${reports.map(r => `
                                    <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl flex justify-between items-center">
                                        <div>
                                            <span class="text-xs px-2 py-0.5 rounded bg-red-950 text-red-400 font-bold uppercase">Reported ${r.targetType}</span>
                                            <h4 class="text-sm font-bold text-white mt-1">Target: "${r.targetName}"</h4>
                                            <p class="text-xs text-slate-300 mt-1"><b>Reason:</b> ${r.reason}</p>
                                        </div>
                                        <div class="flex space-x-2">
                                            <button onclick="inspectedReport = '${r.id}'; render();" class="bg-indigo-600 text-white text-xs px-3 py-2 rounded-lg">Details</button>
                                            <button onclick="deleteReport('${r.id}')" class="bg-red-600/20 border border-red-500/30 text-red-300 text-xs px-3 py-2 rounded-lg">Delete</button>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    ` : ''}

                    ${adminActiveTab === 'announcements' ? `
                        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
                            <h2 class="text-lg font-bold text-white mb-4">Post Announcement</h2>
                            <form onsubmit="postAnnouncement(event)" class="space-y-4">
                                <div><input type="text" id="ann-title" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-white text-sm" placeholder="Title"></div>
                                <div><textarea id="ann-content" rows="3" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-white text-sm" placeholder="Content"></textarea></div>
                                <button type="submit" class="bg-indigo-600 text-white text-xs px-5 py-2.5 rounded-lg">Broadcast</button>
                            </form>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function renderUserCard(u, novels) {
            const userNovelsCount = novels.filter(n => n.authorId === u.id).length;
            const isMenuOpen = openDropdownUserId === u.id;

            return `
                <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4 relative">
                    <!-- ACCOUNT DETAILS SECTION -->
                    <div>
                        <div class="flex items-center space-x-2">
                            <p class="text-sm font-bold text-white">${u.name}</p>
                            <span class="text-xs px-2 py-0.5 rounded bg-indigo-950 border border-indigo-800 text-indigo-300 uppercase font-semibold">${u.isAuthor ? 'Both Reader & Author' : 'Reader Only'}</span>
                        </div>
                        <p class="text-xs text-slate-400 mt-0.5">${u.email}</p>
                        
                        <div class="flex flex-wrap items-center gap-3 mt-2 text-[11px] text-slate-300 bg-slate-900/60 px-3 py-1.5 rounded-lg border border-slate-800/80">
                            <span><b>Risk:</b> <span class="${u.riskGrade === 'High' ? 'text-red-400 font-bold' : (u.riskGrade === 'Moderate' ? 'text-amber-400 font-bold' : 'text-emerald-400')}">${u.riskGrade} (${u.warningCount || 0} Warnings)</span></span>
                            <span>•</span>
                            <span><b>Status:</b> ${u.isBlocked ? '<span class="text-red-500 font-bold">Permanently Blocked</span>' : (u.isSuspended ? `<span class="text-amber-400 font-bold">Suspended [${u.suspendMode.toUpperCase()}]</span>` : '<span class="text-emerald-400">Active</span>')}</span>
                            <span>•</span>
                            <span><b>Novels Published:</b> ${userNovelsCount}</span>
                        </div>
                    </div>

                    <!-- COMPACT 3-DOT DROPDOWN MENU -->
                    <div class="relative dropdown-container ml-auto md:ml-0">
                        <button onclick="openDropdownUserId = ${isMenuOpen ? 'null' : `'${u.id}'`}; render();" class="bg-slate-900 hover:bg-slate-800 text-slate-300 border border-slate-700 px-3 py-1.5 rounded-lg text-sm font-bold transition">
                            <i class="fa-solid fa-ellipsis-vertical"></i>
                        </button>

                        ${isMenuOpen ? `
                            <div class="absolute right-0 mt-2 w-52 bg-slate-900 border border-slate-800 rounded-xl shadow-2xl z-50 py-1.5 flex flex-col text-xs">
                                <button onclick="openDropdownUserId = null; sendDirectPersonalMail('${u.id}');" class="text-left px-4 py-2 hover:bg-slate-800 text-indigo-300 flex items-center space-x-2">
                                    <i class="fa-solid fa-envelope w-4"></i><span>Email User</span>
                                </button>
                                <button onclick="openDropdownUserId = null; manualLowerRisk('${u.id}');" class="text-left px-4 py-2 hover:bg-slate-800 text-purple-300 flex items-center space-x-2">
                                    <i class="fa-solid fa-shield-halved w-4"></i><span>Lower Risk</span>
                                </button>
                                <button onclick="openDropdownUserId = null; recoverUserPassword('${u.id}');" class="text-left px-4 py-2 hover:bg-slate-800 text-amber-300 flex items-center space-x-2">
                                    <i class="fa-solid fa-key w-4"></i><span>Reset Pass</span>
                                </button>
                                ${u.role !== 'admin' ? `
                                    <button onclick="openDropdownUserId = null; sendWarningMail('${u.id}');" class="text-left px-4 py-2 hover:bg-slate-800 text-amber-400 flex items-center space-x-2">
                                        <i class="fa-solid fa-triangle-exclamation w-4"></i><span>Warning</span>
                                    </button>
                                    <button onclick="openDropdownUserId = null; stealthInspectUser('${u.id}');" class="text-left px-4 py-2 hover:bg-slate-800 text-indigo-400 flex items-center space-x-2 font-bold">
                                        <i class="fa-solid fa-ghost w-4"></i><span>Inspect (Ghost Mode)</span>
                                    </button>
                                    ${u.isSuspended ? `
                                        <button onclick="openDropdownUserId = null; unsuspendUser('${u.id}');" class="text-left px-4 py-2 hover:bg-slate-800 text-emerald-400 flex items-center space-x-2 font-semibold">
                                            <i class="fa-solid fa-circle-check w-4"></i><span>Unsuspend</span>
                                        </button>
                                    ` : `
                                        <button onclick="openDropdownUserId = null; manualSuspendUser('${u.id}');" class="text-left px-4 py-2 hover:bg-slate-800 text-amber-400 flex items-center space-x-2">
                                            <i class="fa-solid fa-ban w-4"></i><span>Suspend...</span>
                                        </button>
                                    `}
                                    ${u.isBlocked ? `
                                        <button onclick="openDropdownUserId = null; unblockUser('${u.id}');" class="text-left px-4 py-2 hover:bg-slate-800 text-emerald-400 flex items-center space-x-2 font-bold">
                                            <i class="fa-solid fa-unlock w-4"></i><span>Unblock</span>
                                        </button>
                                    ` : `
                                        <button onclick="openDropdownUserId = null; blockUserPermanently('${u.id}');" class="text-left px-4 py-2 hover:bg-slate-800 text-red-400 flex items-center space-x-2 font-bold">
                                            <i class="fa-solid fa-lock w-4"></i><span>Block Permanently</span>
                                        </button>
                                    `}
                                    <div class="border-t border-slate-800 my-1"></div>
                                    <button onclick="openDropdownUserId = null; deleteUserCompletely('${u.id}');" class="text-left px-4 py-2 hover:bg-red-950/40 text-red-400 flex items-center space-x-2 font-bold">
                                        <i class="fa-solid fa-trash w-4"></i><span>Delete User</span>
                                    </button>
                                ` : ''}
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        render();
    </script>
</body>
</html>
