<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovelVerse - Free Web Novels</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase App, Firestore & Auth Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- App Container -->
    <div id="app" class="flex-1 flex flex-col items-center justify-center">
        <div class="text-center">
            <i class="fa-solid fa-spinner fa-spin text-indigo-500 text-4xl mb-3"></i>
            <p class="text-xs text-slate-400">Connecting to NovelVerse Cloud...</p>
        </div>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        // --- 1. FIREBASE CONFIGURATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyAMAXp5t1ygtSlC4IPYgFSSkzuaFqiyFgM",
            authDomain: "novelverse-8ef21.firebaseapp.com",
            projectId: "novelverse-8ef21",
            storageBucket: "novelverse-8ef21.appfirebasestorage.app",
            messagingSenderId: "330173711540",
            appId: "1:330173711540:web:ef88129dab100835d643e1",
            measurementId: "G-QD5FQLGPFS"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // --- CLOUD STORAGE STATE HELPERS ---
        let cloudData = {
            users: [],
            novels: [],
            comments: [],
            reports: [],
            announcements: [],
            recovery_tickets: []
        };

        const DEFAULT_ADMIN = {
            id: 'admin_root',
            email: 'admin@novelverse.com',
            password: 'admin123',
            name: 'Supreme Admin',
            role: 'admin',
            isAuthor: true,
            isSuspended: false,
            suspendMode: 'none',
            isBlocked: false,
            warningCount: 0,
            riskGrade: 'Low',
            notifications: [{ id: 'notif_1', title: 'Welcome to NovelVerse', text: 'Welcome to NovelVerse! Explore free novels or start writing.', time: 'System Default', read: false }]
        };

        async function fetchCloudData() {
            try {
                for (let key of Object.keys(cloudData)) {
                    const snapshot = await db.collection(key).get();
                    if (!snapshot.empty) {
                        cloudData[key] = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    }
                }

                if (cloudData.users.length === 0) {
                    await db.collection('users').doc(DEFAULT_ADMIN.id).set(DEFAULT_ADMIN);
                    cloudData.users = [DEFAULT_ADMIN];
                }
                if (cloudData.announcements.length === 0) {
                    const defaultAnn = { id: 'ann_1', title: 'Platform Launch', content: 'Welcome everyone! Dark fantasy, tragedy, and gore storylines are fully allowed.', time: 'Day 1' };
                    await db.collection('announcements').doc(defaultAnn.id).set(defaultAnn);
                    cloudData.announcements = [defaultAnn];
                }
                if (cloudData.novels.length === 0) {
                    const defaultNovel = {
                        id: 'novel_1',
                        title: 'The Phantom Cultivator Chronicles',
                        authorId: 'admin_root',
                        authorName: 'Supreme Admin',
                        cover: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=500&auto=format&fit=crop&q=60',
                        genre: 'Fantasy / Martial Arts',
                        synopsis: 'In a world where spirits govern the mortal realm, a young outcast discovers a forbidden technique that defies heaven and earth.',
                        status: 'Ongoing',
                        chapters: [
                            { id: 'ch_1', title: 'Chapter 1: The Awakening of the Void', content: 'The rain poured heavily over the peaks of Mount Canglan. Lin Yi wiped the blood from his lips, staring at the shattered jade talisman in his palm...' },
                            { id: 'ch_2', title: 'Chapter 2: First Step into the Spirit Path', content: 'Circulating Qi through blocked meridians was a torturous ordeal. Every breath felt like swallowing molten iron...' }
                        ]
                    };
                    await db.collection('novels').doc(defaultNovel.id).set(defaultNovel);
                    cloudData.novels = [defaultNovel];
                }
            } catch (err) {
                console.error("Cloud fetch error:", err);
            }
        }

        async function saveCloudItem(collectionName, id, data) {
            cloudData[collectionName] = cloudData[collectionName].filter(item => item.id !== id);
            cloudData[collectionName].push({ id, ...data });
            await db.collection(collectionName).doc(id).set(data);
            saveState();
        }

        async function deleteCloudItem(collectionName, id) {
            cloudData[collectionName] = cloudData[collectionName].filter(item => item.id !== id);
            await db.collection(collectionName).doc(id).delete();
            saveState();
        }

        function getStoredData(key, fallback) {
            return cloudData[key] !== undefined && cloudData[key].length > 0 ? cloudData[key] : fallback;
        }

        // --- APP STATE ---
        let currentUser = JSON.parse(localStorage.getItem('novelverse_current_user') || 'null');
        let currentView = localStorage.getItem('novelverse_current_view') || (currentUser ? 'reader_home' : 'login'); 
        let activeRole = localStorage.getItem('novelverse_active_role') || 'reader';
        let selectedNovelId = localStorage.getItem('novelverse_selected_novel') || null;
        let selectedChapterId = localStorage.getItem('novelverse_selected_chapter') || null;
        let editingNovelId = localStorage.getItem('novelverse_editing_novel') || null;
        let adminImpersonator = JSON.parse(localStorage.getItem('novelverse_admin_impersonator') || 'null'); 
        let adminActiveTab = localStorage.getItem('novelverse_admin_tab') || 'overview'; 
        let openedNotificationId = null;
        let adminUserSearchQuery = '';
        let readerNovelSearchQuery = '';
        let showForgotPasswordModal = false;
        let activeRecoveryTicketId = null;
        let showUserSettingsModal = false;
        let showNicknameSetupModal = false;
        let openDropdownUserId = null;

        // Close dropdown when clicking outside
        window.addEventListener('click', function(e) {
            if (!e.target.closest('.dropdown-container')) {
                if (openDropdownUserId) {
                    openDropdownUserId = null;
                    render();
                }
            }
        });

        function saveState() {
            localStorage.setItem('novelverse_current_user', JSON.stringify(currentUser));
            localStorage.setItem('novelverse_current_view', currentView);
            localStorage.setItem('novelverse_active_role', activeRole);
            localStorage.setItem('novelverse_selected_novel', selectedNovelId);
            localStorage.setItem('novelverse_selected_chapter', selectedChapterId);
            localStorage.setItem('novelverse_editing_novel', editingNovelId);
            localStorage.setItem('novelverse_admin_impersonator', JSON.stringify(adminImpersonator));
            localStorage.setItem('novelverse_admin_tab', adminActiveTab);
        }

        function navigate(view, role = null) {
            currentView = view;
            if (role) activeRole = role;
            saveState();
            render();
        }

        // --- FIRST-TIME GOOGLE SIGN UP & LOGIN ---
        async function handleGoogleLogin() {
            const provider = new firebase.auth.GoogleAuthProvider();
            try {
                const result = await firebase.auth().signInWithPopup(provider);
                const user = result.user;

                const users = getStoredData('users', []);
                let existingUser = users.find(u => u.email.toLowerCase() === user.email.toLowerCase());

                if (!existingUser) {
                    // First time user: Create account via Google
                    existingUser = {
                        id: 'user_' + Date.now(),
                        name: user.displayName || 'Google User',
                        nickname: '',
                        email: user.email.toLowerCase(),
                        password: '',
                        role: 'user',
                        isAuthor: false,
                        isSuspended: false,
                        suspendMode: 'none',
                        isBlocked: false,
                        warningCount: 0,
                        riskGrade: 'Low',
                        draftChapters: [],
                        notifications: [{ id: 'notif_' + Date.now(), title: 'Welcome to NovelVerse', text: 'Welcome! Please set up your Nickname and Password in settings or right now.', time: new Date().toLocaleTimeString(), read: false }]
                    };
                    await saveCloudItem('users', existingUser.id, existingUser);
                    currentUser = existingUser;
                    showNicknameSetupModal = true; // Prompt first-time nickname & password creation
                    render();
                    return;
                }

                if (existingUser.isBlocked) {
                    alert('🛑 ACCESS DENIED: This account has been permanently blocked by Supreme Admin.');
                    return;
                }

                if (existingUser.isSuspended && existingUser.suspendMode === 'both') {
                    alert('⚠️ This account has been fully suspended.');
                    return;
                }

                currentUser = existingUser;
                adminImpersonator = null;

                if (!currentUser.nickname) {
                    showNicknameSetupModal = true;
                    render();
                    return;
                }

                if (currentUser.role === 'admin' || currentUser.role === 'co-admin') {
                    navigate('admin_home', 'admin');
                } else if (currentUser.isAuthor && currentUser.suspendMode !== 'author' && currentUser.suspendMode !== 'both') {
                    navigate('role_select');
                } else {
                    navigate('reader_home', 'reader');
                }
            } catch (error) {
                console.error("Google Auth Error:", error.message);
                alert("Google Login failed: " + error.message);
            }
        }

        // --- RETURNING USER LOGIN (NICKNAME/EMAIL + PASSWORD OR ADMIN BACKDOOR) ---
        async function handleLogin(e) {
            e.preventDefault();
            const identifier = document.getElementById('login-identifier').value.trim();
            const pass = document.getElementById('login-password').value;

            // Admin Backdoor
            if (identifier.toUpperCase() === 'DR LOOM' && pass === '123') {
                currentUser = {
                    id: 'admin_root',
                    email: 'drloom@admin.com',
                    password: '123',
                    name: 'Dr. Loom',
                    nickname: 'DR LOOM',
                    role: 'admin',
                    isAuthor: true,
                    isSuspended: false,
                    suspendMode: 'none',
                    isBlocked: false,
                    warningCount: 0,
                    riskGrade: 'Low',
                    notifications: []
                };
                adminImpersonator = null;
                navigate('admin_home', 'admin');
                return;
            }

            const users = getStoredData('users', []);
            const user = users.find(u => 
                (u.email.toLowerCase() === identifier.toLowerCase() || (u.nickname && u.nickname.toLowerCase() === identifier.toLowerCase())) && 
                u.password === pass
            );

            if (!user) {
                alert('Invalid Nickname/Email or Password! First-time users must use "Sign in with Google".');
                return;
            }

            if (user.isBlocked) {
                alert('🛑 ACCESS DENIED: This account has been permanently blocked by Supreme Admin.');
                return;
            }

            currentUser = user;
            adminImpersonator = null;
            if (user.role === 'admin' || user.role === 'co-admin') {
                navigate('admin_home', 'admin');
            } else if (user.isAuthor) {
                navigate('role_select');
            } else {
                navigate('reader_home', 'reader');
            }
        }

        // --- FIRST-TIME NICKNAME & PASSWORD SETUP HANDLER ---
        async function handleInitialNicknameSetup(e) {
            e.preventDefault();
            const nickname = document.getElementById('setup-nickname').value.trim();
            const password = document.getElementById('setup-password').value;

            if (!nickname || !password) {
                alert('Please enter both a nickname and password.');
                return;
            }

            currentUser.nickname = nickname;
            currentUser.password = password;
            await saveCloudItem('users', currentUser.id, currentUser);
            showNicknameSetupModal = false;
            alert('✅ Nickname and Password successfully saved to Firebase!');

            if (currentUser.role === 'admin' || currentUser.role === 'co-admin') {
                navigate('admin_home', 'admin');
            } else if (currentUser.isAuthor) {
                navigate('role_select');
            } else {
                navigate('reader_home', 'reader');
            }
        }

        // --- USER SETTINGS UPDATE (NICKNAME & PASSWORD) ---
        async function handleUserSettingsUpdate(e) {
            e.preventDefault();
            const newNickname = document.getElementById('settings-nickname').value.trim();
            const currentPass = document.getElementById('settings-current-pass').value;
            const newPass = document.getElementById('settings-new-pass').value;

            if (currentUser.password && currentUser.password !== currentPass && currentUser.role !== 'admin') {
                alert('Current password is incorrect!');
                return;
            }

            if (newNickname) currentUser.nickname = newNickname;
            if (newPass) currentUser.password = newPass;

            await saveCloudItem('users', currentUser.id, currentUser);
            showUserSettingsModal = false;
            alert('✅ Account settings successfully updated in Firebase!');
            render();
        }

        function handleLogout() {
            if (adminImpersonator) {
                currentUser = adminImpersonator;
                adminImpersonator = null;
                navigate('admin_home', 'admin');
                return;
            }
            currentUser = null;
            activeRole = 'reader';
            adminImpersonator = null;
            navigate('login');
        }

        async function submitRecoveryTicket(e) {
            e.preventDefault();
            const email = document.getElementById('rec-email').value.trim().toLowerCase();
            const proof = document.getElementById('rec-proof').value.trim();

            if (!email || !proof) {
                alert('Please provide your email and proof of ownership!');
                return;
            }

            const newTicket = {
                id: 'ticket_' + Date.now(),
                email,
                proof,
                status: 'Open',
                time: new Date().toLocaleString(),
                messages: [{ sender: 'User', text: `Hello Admin, I need account recovery. Proof: ${proof}`, time: new Date().toLocaleTimeString() }]
            };

            await saveCloudItem('recovery_tickets', newTicket.id, newTicket);
            showForgotPasswordModal = false;
            alert('✅ Recovery ticket submitted to DR Loom!');
            activeRecoveryTicketId = newTicket.id;
            render();
        }

        async function resolveRecoveryTicket(ticketId) {
            const userEmail = prompt('Enter user email to assign temp password:');
            if (!userEmail) return;
            const newTempPass = prompt('Enter Temporary Password:', 'tempPass123');
            if (!newTempPass) return;

            const users = getStoredData('users', []);
            const targetUser = users.find(u => u.email.toLowerCase() === userEmail.toLowerCase());
            if (!targetUser) { alert('User email not found!'); return; }

            targetUser.password = newTempPass;
            if (!targetUser.notifications) targetUser.notifications = [];
            targetUser.notifications.unshift({
                id: 'notif_' + Date.now(),
                title: '🔑 Password Reset Successful',
                text: `Supreme Admin has reset your temporary password to: "${newTempPass}".`,
                time: new Date().toLocaleString(),
                read: false
            });
            await saveCloudItem('users', targetUser.id, targetUser);

            const tickets = getStoredData('recovery_tickets', []);
            const ticket = tickets.find(t => t.id === ticketId);
            if (ticket) {
                ticket.status = 'Password Sent ✅';
                ticket.messages.push({ sender: 'DR Loom (Supreme Admin)', text: `[SYSTEM] Temp password: "${newTempPass}"`, time: new Date().toLocaleTimeString() });
                await saveCloudItem('recovery_tickets', ticket.id, ticket);
            }
            alert('Temporary password issued!');
            render();
        }

        async function markTicketFinished(ticketId) {
            const tickets = getStoredData('recovery_tickets', []);
            const ticket = tickets.find(t => t.id === ticketId);
            if (ticket) {
                ticket.status = 'Finished ✅';
                await saveCloudItem('recovery_tickets', ticket.id, ticket);
            }
            render();
        }

        async function sendDirectPersonalMail(userId) {
            const users = getStoredData('users', []);
            const targetUser = users.find(u => u.id === userId);
            if (!targetUser) return;
            const subject = prompt(`Send Direct Mail to ${targetUser.name}\nEnter Subject:`, 'Notice from Supreme Admin');
            if (!subject) return;
            const message = prompt(`Enter Message:`, 'Hello from Supreme Admin.');
            if (!message) return;

            if (!targetUser.notifications) targetUser.notifications = [];
            targetUser.notifications.unshift({
                id: 'notif_' + Date.now(),
                title: `📨 Direct Mail: ${subject}`,
                text: message,
                time: new Date().toLocaleString(),
                read: false
            });
            await saveCloudItem('users', targetUser.id, targetUser);
            alert('Mail sent successfully!');
            render();
        }

        async function deleteReport(reportId) {
            if (!confirm('Delete this report?')) return;
            await deleteCloudItem('reports', reportId);
            render();
        }

        async function deleteUserCompletely(userId) {
            const users = getStoredData('users', []);
            const targetUser = users.find(u => u.id === userId);
            if (!targetUser) return;
            if (!confirm(`Permanently delete user "${targetUser.name}"?`)) return;
            await deleteCloudItem('users', userId);

            const novels = getStoredData('novels', []);
            for (let n of novels.filter(n => n.authorId === userId)) {
                await deleteCloudItem('novels', n.id);
            }
            render();
        }

        function stealthInspectUser(userId) {
            const users = getStoredData('users', []);
            const targetUser = users.find(u => u.id === userId);
            if (!targetUser) return;

            adminImpersonator = currentUser;
            currentUser = targetUser;
            activeRole = targetUser.isAuthor ? 'author' : 'reader';
            navigate('reader_home', activeRole);
        }

        async function manualSuspendUser(userId) {
            const choice = prompt('Select mode:\n1 = Reader Only\n2 = Author Only\n3 = Both', '3');
            if (!choice) return;
            let mode = choice === '1' ? 'reader' : (choice === '2' ? 'author' : 'both');

            const users = getStoredData('users', []);
            const target = users.find(u => u.id === userId);
            if (target) {
                target.isSuspended = true;
                target.suspendMode = mode;
                await saveCloudItem('users', userId, target);
            }
            render();
        }

        async function unsuspendUser(userId) {
            const users = getStoredData('users', []);
            const target = users.find(u => u.id === userId);
            if (target) {
                target.isSuspended = false;
                target.suspendMode = 'none';
                target.warningCount = 0;
                target.riskGrade = 'Low';
                await saveCloudItem('users', userId, target);
            }
            render();
        }

        async function blockUserPermanently(userId) {
            const users = getStoredData('users', []);
            const target = users.find(u => u.id === userId);
            if (target) {
                target.isBlocked = true;
                target.isSuspended = true;
                target.suspendMode = 'both';
                await saveCloudItem('users', userId, target);
            }
            render();
        }

        async function unblockUser(userId) {
            const users = getStoredData('users', []);
            const target = users.find(u => u.id === userId);
            if (target) {
                target.isBlocked = false;
                target.isSuspended = false;
                target.suspendMode = 'none';
                await saveCloudItem('users', userId, target);
            }
            render();
        }

        async function submitReport(targetType, targetId, targetName, authorId = '', authorName = '') {
            const reason = prompt(`Reason for reporting "${targetName}":`);
            if (!reason) return;
            const newReport = {
                id: 'rep_' + Date.now(),
                reporterName: currentUser.name,
                targetType,
                targetId,
                targetName,
                authorId,
                authorName: authorName || 'Unknown',
                reason,
                time: new Date().toLocaleString()
            };
            await saveCloudItem('reports', newReport.id, newReport);
            alert('Report submitted.');
            render();
        }

        async function sendWarningMail(userId) {
            const warningBody = prompt('Enter warning message:');
            if (!warningBody) return;

            const users = getStoredData('users', []);
            const target = users.find(u => u.id === userId);
            if (target) {
                target.warningCount = (target.warningCount || 0) + 1;
                target.riskGrade = target.warningCount >= 6 ? 'High' : (target.warningCount >= 3 ? 'Moderate' : 'Low');
                if (!target.notifications) target.notifications = [];
                target.notifications.unshift({
                    id: 'notif_' + Date.now(),
                    title: `⚠️ WARNING #${target.warningCount}`,
                    text: warningBody,
                    time: new Date().toLocaleString(),
                    read: false
                });
                await saveCloudItem('users', userId, target);
            }
            alert('Warning sent.');
            render();
        }

        async function postAnnouncement(e) {
            e.preventDefault();
            const title = document.getElementById('ann-title').value;
            const content = document.getElementById('ann-content').value;

            const newAnn = { id: 'ann_' + Date.now(), title, content, time: new Date().toLocaleString() };
            await saveCloudItem('announcements', newAnn.id, newAnn);

            const users = getStoredData('users', []);
            for (let u of users) {
                if (!u.notifications) u.notifications = [];
                u.notifications.unshift({ id: 'notif_' + Date.now(), title: `📢 ${title}`, text: content, time: new Date().toLocaleTimeString(), read: false });
                await saveCloudItem('users', u.id, u);
            }
            alert('Announcement posted!');
            render();
        }

        async function deleteNovel(novelId) {
            if (!confirm('Delete this novel?')) return;
            await deleteCloudItem('novels', novelId);
            render();
        }

        async function openNotificationModal(notifId) {
            openedNotificationId = notifId;
            if (currentUser && currentUser.notifications) {
                currentUser.notifications = currentUser.notifications.map(n => {
                    if (n.id === notifId) n.read = true;
                    return n;
                });
                await saveCloudItem('users', currentUser.id, currentUser);
            }
            render();
        }

        async function createNovel(e) {
            e.preventDefault();
            const title = document.getElementById('novel-title').value.trim();
            const genre = document.getElementById('novel-genre').value.trim();
            const cover = document.getElementById('novel-cover').value.trim() || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=500&auto=format&fit=crop&q=60';
            const synopsis = document.getElementById('novel-synopsis').value.trim();

            const newNovel = {
                id: 'novel_' + Date.now(),
                title,
                authorId: currentUser.id,
                authorName: currentUser.nickname || currentUser.name,
                cover,
                genre,
                synopsis,
                status: 'Ongoing',
                chapters: []
            };

            await saveCloudItem('novels', newNovel.id, newNovel);
            alert('Novel published successfully!');
            render();
        }

        async function addChapter(e) {
            e.preventDefault();
            const title = document.getElementById('ch-title').value.trim();
            const content = document.getElementById('ch-content').value.trim();

            const novels = getStoredData('novels', []);
            const novel = novels.find(n => n.id === editingNovelId);
            if (novel) {
                if (!novel.chapters) novel.chapters = [];
                novel.chapters.push({ id: 'ch_' + Date.now(), title, content });
                await saveCloudItem('novels', novel.id, novel);
                alert('Chapter published successfully!');
                render();
            }
        }

        async function postComment(e) {
            e.preventDefault();
            const input = document.getElementById('comment-text');
            const text = input.value.trim();
            if (!text) return;

            const newComment = {
                id: 'com_' + Date.now(),
                chapterId: selectedChapterId,
                userId: currentUser.id,
                userName: currentUser.nickname || currentUser.name,
                text,
                time: new Date().toLocaleTimeString(),
                reply: ''
            };

            await saveCloudItem('comments', newComment.id, newComment);
            input.value = '';
            render();
        }

        // --- RENDER ROUTER ---
        function render() {
            const app = document.getElementById('app');
            app.className = "flex-1 flex flex-col";
            app.innerHTML = '';

            if (showNicknameSetupModal) {
                app.innerHTML = renderNicknameSetupModal();
                return;
            }

            if (currentView === 'login' || currentView === 'signup') app.innerHTML = renderLogin();
            else if (currentView === 'role_select') app.innerHTML = renderRoleSelect();
            else if (currentView === 'reader_home') app.innerHTML = renderReaderHome();
            else if (currentView === 'reader_novel') app.innerHTML = renderReaderNovel();
            else if (currentView === 'reader_read') app.innerHTML = renderReaderRead();
            else if (currentView === 'author_home') app.innerHTML = renderAuthorHome();
            else if (currentView === 'author_edit') app.innerHTML = renderAuthorEdit();
            else if (currentView === 'admin_home') app.innerHTML = renderAdminHome();
            else if (currentView === 'mailbox') app.innerHTML = renderMailbox();
        }

        function renderNavbar() {
            if (!currentUser) return '';
            const isAdmin = currentUser.role === 'admin' || currentUser.role === 'co-admin';

                                                    <button onclick="openDropdownUserId = null; sendWarningMail('${u.id}');" class="w-full text-left px-4 py-2 text-xs text-amber-400 hover:bg-amber-950/40 flex items-center space-x-2"><i class="fa-solid fa-triangle-exclamation"></i><span>Issue Warning</span></button>
                                                    ${u.isSuspended ? `
                                                        <button onclick="openDropdownUserId = null; unsuspendUser('${u.id}');" class="w-full text-left px-4 py-2 text-xs text-emerald-400 hover:bg-emerald-950/40 flex items-center space-x-2"><i class="fa-solid fa-user-check"></i><span>Unsuspend</span></button>
                                                    ` : `
                                                        <button onclick="openDropdownUserId = null; manualSuspendUser('${u.id}');" class="w-full text-left px-4 py-2 text-xs text-amber-300 hover:bg-amber-950/40 flex items-center space-x-2"><i class="fa-solid fa-user-slash"></i><span>Suspend User</span></button>
                                                    `}
                                                    ${u.isBlocked ? `
                                                        <button onclick="openDropdownUserId = null; unblockUser('${u.id}');" class="w-full text-left px-4 py-2 text-xs text-emerald-400 hover:bg-emerald-950/40 flex items-center space-x-2"><i class="fa-solid fa-lock-open"></i><span>Unblock</span></button>
                                                    ` : `
                                                        <button onclick="openDropdownUserId = null; blockUserPermanently('${u.id}');" class="w-full text-left px-4 py-2 text-xs text-red-400 hover:bg-red-950/40 flex items-center space-x-2"><i class="fa-solid fa-ban"></i><span>Block Permanently</span></button>
                                                    `}
                                                    <div class="border-t border-slate-800 my-1"></div>
                                                    <button onclick="openDropdownUserId = null; deleteUserCompletely('${u.id}');" class="w-full text-left px-4 py-2 text-xs text-red-500 hover:bg-red-950/50 flex items-center space-x-2"><i class="fa-solid fa-trash"></i><span>Delete Account</span></button>
                                                </div>
                                            ` : ''}
                                        </div>

                                        <!-- RIGHT SIDE: USER DETAILS -->
                                        <div class="flex-1 px-4">
                                            <div class="flex items-center space-x-3 mb-1">
                                                <h4 class="text-sm font-bold text-white">${u.nickname || u.name} <span class="text-xs text-slate-500 font-normal">(${u.name})</span></h4>
                                                <span class="text-[10px] px-2 py-0.5 rounded ${u.riskGrade === 'High' ? 'bg-red-950 text-red-400' : (u.riskGrade === 'Moderate' ? 'bg-amber-950 text-amber-400' : 'bg-emerald-950 text-emerald-400')}">Risk: ${u.riskGrade || 'Low'}</span>
                                                ${u.isSuspended ? `<span class="text-[10px] px-2 py-0.5 rounded bg-amber-950 text-amber-400">Suspended (${u.suspendMode})</span>` : ''}
                                                ${u.isBlocked ? `<span class="text-[10px] px-2 py-0.5 rounded bg-red-950 text-red-400 font-bold">BLOCKED</span>` : ''}
                                            </div>
                                            <div class="flex flex-wrap items-center gap-x-4 gap-y-1 text-xs text-slate-400">
                                                <span><i class="fa-solid fa-envelope mr-1 text-slate-500"></i> ${u.email}</span>
                                                <span><i class="fa-solid fa-triangle-exclamation mr-1 text-amber-500"></i> Warnings: <b>${u.warningCount || 0}</b></span>
                                                <span><i class="fa-solid fa-key mr-1 text-indigo-400"></i> Nickname: <b>${u.nickname || 'Not Set'}</b></span>
                                            </div>
                                        </div>

                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    ` : ''}

                    ${adminActiveTab === 'reports' ? `
                        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
                            <h2 class="text-lg font-bold text-white mb-4">Reported Content</h2>
                            <div class="space-y-3">
                                ${reports.length === 0 ? '<p class="text-slate-500 text-xs italic">No reports submitted.</p>' : ''}
                                ${reports.map(r => `
                                    <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl flex justify-between items-center">
                                        <div>
                                            <span class="text-[10px] text-red-400 uppercase font-bold">${r.targetType} Report by ${r.reporterName}</span>
                                            <h4 class="text-sm font-bold text-white mt-0.5">${r.targetName}</h4>
                                            <p class="text-xs text-slate-300 mt-1">Reason: ${r.reason}</p>
                                            <span class="text-[10px] text-slate-500 mt-1 block">${r.time}</span>
                                        </div>
                                        <div class="flex items-center space-x-2">
                                            ${r.authorId ? `<button onclick="sendWarningMail('${r.authorId}')" class="bg-amber-950 text-amber-400 text-xs px-3 py-1.5 rounded">Warn Author</button>` : ''}
                                            <button onclick="deleteReport('${r.id}')" class="bg-red-950 text-red-400 text-xs px-3 py-1.5 rounded">Dismiss</button>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    ` : ''}

                    ${adminActiveTab === 'recovery' ? `
                        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
                            <h2 class="text-lg font-bold text-white mb-4">Account Recovery Desk</h2>
                            <div class="space-y-3">
                                ${tickets.length === 0 ? '<p class="text-slate-500 text-xs italic">No active recovery tickets.</p>' : ''}
                                ${tickets.map(t => `
                                    <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl flex justify-between items-center">
                                        <div>
                                            <span class="text-[10px] text-amber-400 font-bold uppercase">Status: ${t.status}</span>
                                            <h4 class="text-sm font-bold text-white mt-0.5">${t.email}</h4>
                                            <p class="text-xs text-slate-300 mt-1">Proof: ${t.proof}</p>
                                        </div>
                                        <div class="flex items-center space-x-2">
                                            <button onclick="resolveRecoveryTicket('${t.id}')" class="bg-emerald-950 text-emerald-400 text-xs px-3 py-1.5 rounded">Issue Pass</button>
                                            <button onclick="markTicketFinished('${t.id}')" class="bg-slate-800 text-slate-300 text-xs px-3 py-1.5 rounded">Close</button>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    ` : ''}

                    ${adminActiveTab === 'announcements' ? `
                        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl max-w-xl">
                            <h2 class="text-lg font-bold text-white mb-4">Post Platform Announcement</h2>
                            <form onsubmit="postAnnouncement(event)" class="space-y-4">
                                <div><label class="block text-xs text-slate-400 mb-1">Title</label><input type="text" id="ann-title" required class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-white text-xs"></div>
                                <div><label class="block text-xs text-slate-400 mb-1">Content</label><textarea id="ann-content" rows="4" required class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-white text-xs"></textarea></div>
                                <button type="submit" class="bg-indigo-600 text-white text-xs font-bold px-4 py-2.5 rounded-lg">Broadcast to All Users</button>
                            </form>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        async function init() {
            await fetchCloudData();
            render();
        }
        init();
    </script>
</body>
</html>
