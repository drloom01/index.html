<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovelVerse - Free Web Novels</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase App & Firestore SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta+ Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- App Container -->
    <div id="app" class="flex-1 flex flex-col items-center justify-center">
        <div class="text-center">
            <i class="fa-solid fa-spinner fa-spin text-indigo-500 text-4xl mb-3"></i>
            <p class="text-xs text-slate-400">Connecting to NovelVerse Cloud...</p>
        </div>
    </div>

    <!-- JavaScript Application Logic with Firebase Cloud Sync -->
    <script>
        // --- 1. FIREBASE CONFIGURATION (YOUR LIVE KEYS) ---
        const firebaseConfig = {
            apiKey: "AIzaSyAMAXp5t1ygtSlC4IPYgFSSkzuaFqiyFgM",
            authDomain: "novelverse-8ef21.firebaseapp.com",
            projectId: "novelverse-8ef21",
            storageBucket: "novelverse-8ef21.appfirebasestorage.app",
            messagingSenderId: "330173711540",
            appId: "1:330173711540:web:ef88129dab100835d643e1",
            measurementId: "G-QD5FQLGPFS"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // --- CLOUD STORAGE STATE HELPERS ---
        let cloudData = {
            users: [],
            novels: [],
            comments: [],
            reports: [],
            announcements: [],
            recovery_tickets: []
        };

        const DEFAULT_ADMIN = {
            id: 'admin_root',
            email: 'admin@novelverse.com',
            password: 'admin123',
            name: 'Supreme Admin',
            role: 'admin',
            isAuthor: true,
            isSuspended: false,
            suspendMode: 'none',
            isBlocked: false,
            warningCount: 0,
            riskGrade: 'Low',
            notifications: [{ id: 'notif_1', title: 'Welcome to NovelVerse', text: 'Welcome to NovelVerse! Explore free novels or start writing.', time: 'System Default', read: false }]
        };

        async function fetchCloudData() {
            try {
                for (let key of Object.keys(cloudData)) {
                    const snapshot = await db.collection(key).get();
                    if (!snapshot.empty) {
                        cloudData[key] = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    }
                }

                if (cloudData.users.length === 0) {
                    await db.collection('users').doc(DEFAULT_ADMIN.id).set(DEFAULT_ADMIN);
                    cloudData.users = [DEFAULT_ADMIN];
                }
                if (cloudData.announcements.length === 0) {
                    const defaultAnn = { id: 'ann_1', title: 'Platform Launch', content: 'Welcome everyone! Dark fantasy, tragedy, and gore storylines are fully allowed.', time: 'Day 1' };
                    await db.collection('announcements').doc(defaultAnn.id).set(defaultAnn);
                    cloudData.announcements = [defaultAnn];
                }
                if (cloudData.novels.length === 0) {
                    const defaultNovel = {
                        id: 'novel_1',
                        title: 'The Phantom Cultivator Chronicles',
                        authorId: 'admin_root',
                        authorName: 'Supreme Admin',
                        cover: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=500&auto=format&fit=crop&q=60',
                        genre: 'Fantasy / Martial Arts',
                        synopsis: 'In a world where spirits govern the mortal realm, a young outcast discovers a forbidden technique that defies heaven and earth.',
                        status: 'Ongoing',
                        chapters: [
                            { id: 'ch_1', title: 'Chapter 1: The Awakening of the Void', content: 'The rain poured heavily over the peaks of Mount Canglan. Lin Yi wiped the blood from his lips, staring at the shattered jade talisman in his palm...' },
                            { id: 'ch_2', title: 'Chapter 2: First Step into the Spirit Path', content: 'Circulating Qi through blocked meridians was a torturous ordeal. Every breath felt like swallowing molten iron...' }
                        ]
                    };
                    await db.collection('novels').doc(defaultNovel.id).set(defaultNovel);
                    cloudData.novels = [defaultNovel];
                }
            } catch (err) {
                console.error("Cloud fetch error:", err);
            }
        }

        async function saveCloudItem(collectionName, id, data) {
            cloudData[collectionName] = cloudData[collectionName].filter(item => item.id !== id);
            cloudData[collectionName].push({ id, ...data });
            await db.collection(collectionName).doc(id).set(data);
            saveState();
        }

        async function deleteCloudItem(collectionName, id) {
            cloudData[collectionName] = cloudData[collectionName].filter(item => item.id !== id);
            await db.collection(collectionName).doc(id).delete();
            saveState();
        }

        function getStoredData(key, fallback) {
            return cloudData[key] !== undefined && cloudData[key].length > 0 ? cloudData[key] : fallback;
        }

        // --- APP STATE ---
        let currentUser = JSON.parse(localStorage.getItem('novelverse_current_user') || 'null');
        let currentView = localStorage.getItem('novelverse_current_view') || (currentUser ? 'dashboard' : 'login'); 
        let activeRole = localStorage.getItem('novelverse_active_role') || 'reader';
        let selectedNovelId = localStorage.getItem('novelverse_selected_novel') || null;
        let selectedChapterId = localStorage.getItem('novelverse_selected_chapter') || null;
        let editingNovelId = localStorage.getItem('novelverse_editing_novel') || null;
        let adminImpersonator = JSON.parse(localStorage.getItem('novelverse_admin_impersonator') || 'null'); 
        let adminActiveTab = localStorage.getItem('novelverse_admin_tab') || 'overview'; 
        let inspectedReport = null;
        let openedNotificationId = null;
        let adminUserSearchQuery = '';
        let readerNovelSearchQuery = '';
        let showForgotPasswordModal = false;
        let activeRecoveryTicketId = null;
        let showUserSettingsModal = false;
        let openDropdownUserId = null;

        window.addEventListener('click', function(e) {
            if (!e.target.closest('.dropdown-container')) {
                if (openDropdownUserId) {
                    openDropdownUserId = null;
                    render();
                }
            }
        });

        function saveState() {
            localStorage.setItem('novelverse_current_user', JSON.stringify(currentUser));
            localStorage.setItem('novelverse_current_view', currentView);
            localStorage.setItem('novelverse_active_role', activeRole);
            localStorage.setItem('novelverse_selected_novel', selectedNovelId);
            localStorage.setItem('novelverse_selected_chapter', selectedChapterId);
            localStorage.setItem('novelverse_editing_novel', editingNovelId);
            localStorage.setItem('novelverse_admin_impersonator', JSON.stringify(adminImpersonator));
            localStorage.setItem('novelverse_admin_tab', adminActiveTab);
        }

        function navigate(view, role = null) {
            currentView = view;
            if (role) activeRole = role;
            saveState();
            render();
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const pass = document.getElementById('login-password').value;

            if (email.toUpperCase() === 'DR LOOM' && pass === '123') {
                currentUser = {
                    id: 'admin_root',
                    email: 'drloom@admin.com',
                    name: 'Dr. Loom (Supreme Admin)',
                    role: 'admin',
                    isAuthor: true,
                    isSuspended: false,
                    suspendMode: 'none',
                    isBlocked: false,
                    warningCount: 0,
                    riskGrade: 'Low',
                    notifications: []
                };
                adminImpersonator = null;
                navigate('admin_home', 'admin');
                return;
            }

            const users = getStoredData('users', []);
            const user = users.find(u => u.email.toLowerCase() === email.toLowerCase() && u.password === pass);
            if (!user) {
                alert('Invalid email or password!');
                return;
            }

            if (user.isBlocked) {
                alert('🛑 ACCESS DENIED: This account has been permanently blocked by Supreme Admin.');
                return;
            }

            if (user.isSuspended && user.suspendMode === 'both') {
                alert('⚠️ This account has been fully suspended.');
                return;
            }

            currentUser = user;
            adminImpersonator = null;
            if (user.role === 'admin' || user.role === 'co-admin') {
                navigate('admin_home', 'admin');
            } else if (user.isAuthor && user.suspendMode !== 'author' && user.suspendMode !== 'both') {
                navigate('role_select');
            } else {
                navigate('reader_home', 'reader');
            }
        }

        async function handleSignup(e) {
            e.preventDefault();
            const name = document.getElementById('signup-name').value.trim();
            const email = document.getElementById('signup-email').value.trim().toLowerCase();
            const pass = document.getElementById('signup-password').value;

            if (!email.endsWith('@gmail.com')) {
                alert('Please use a valid Gmail address ending with @gmail.com!');
                return;
            }

            const users = getStoredData('users', []);
            if (users.some(u => u.email === email)) {
                alert('This Gmail address is already registered!');
                return;
            }

            const newUser = {
                id: 'user_' + Date.now(),
                name,
                email,
                password: pass,
                role: 'user',
                isAuthor: false,
                isSuspended: false,
                suspendMode: 'none',
                isBlocked: false,
                warningCount: 0,
                riskGrade: 'Low',
                draftChapters: [],
                notifications: [{ id: 'notif_' + Date.now(), title: 'Welcome to NovelVerse', text: 'Welcome to NovelVerse! Your account has been successfully created.', time: new Date().toLocaleTimeString(), read: false }]
            };

            await saveCloudItem('users', newUser.id, newUser);
            currentUser = newUser;
            alert('Account created successfully!');
            navigate('reader_home', 'reader');
        }

        function handleLogout() {
            if (adminImpersonator) {
                currentUser = adminImpersonator;
                adminImpersonator = null;
                navigate('admin_home', 'admin');
                return;
            }
            currentUser = null;
            activeRole = 'reader';
            adminImpersonator = null;
            navigate('login');
        }

        async function handleUserPasswordChange(e) {
            e.preventDefault();
            const currentPass = document.getElementById('settings-current-pass').value;
            const newPass = document.getElementById('settings-new-pass').value;

            if (currentUser.password !== currentPass && currentUser.role !== 'admin') {
                alert('Current password is incorrect!');
                return;
            }

            currentUser.password = newPass;
            await saveCloudItem('users', currentUser.id, currentUser);
            showUserSettingsModal = false;
            alert('✅ Password successfully updated!');
            render();
        }

        async function submitRecoveryTicket(e) {
            e.preventDefault();
            const email = document.getElementById('rec-email').value.trim().toLowerCase();
            const proof = document.getElementById('rec-proof').value.trim();

            if (!email || !proof) {
                alert('Please provide your email and proof of ownership!');
                return;
            }

            const newTicket = {
                id: 'ticket_' + Date.now(),
                email,
                proof,
                status: 'Open',
                time: new Date().toLocaleString(),
                messages: [
                    { sender: 'User', text: `Hello Admin, I lost my password. Proof of ownership: ${proof}`, time: new Date().toLocaleTimeString() }
                ]
            };

            await saveCloudItem('recovery_tickets', newTicket.id, newTicket);
            showForgotPasswordModal = false;
            alert('✅ Recovery ticket submitted to DR Loom! Your temporary support chat has been opened.');
            activeRecoveryTicketId = newTicket.id;
            render();
        }

        async function sendRecoveryChatMessage(e) {
            e.preventDefault();
            const input = document.getElementById('ticket-chat-input');
            const text = input.value.trim();
            if (!text) return;

            const senderName = (currentUser && currentUser.role === 'admin') ? 'DR Loom (Supreme Admin)' : 'User';
            const tickets = getStoredData('recovery_tickets', []);
            const ticket = tickets.find(t => t.id === activeRecoveryTicketId);
            if (ticket) {
                ticket.messages.push({ sender: senderName, text, time: new Date().toLocaleTimeString() });
                await saveCloudItem('recovery_tickets', ticket.id, ticket);
            }
            input.value = '';
            render();
        }

        async function resolveRecoveryTicket(ticketId) {
            const userEmail = prompt('Enter the user email to assign a temporary password to:');
            if (!userEmail) return;
            const newTempPass = prompt('Enter the Temporary Password for this user:', 'tempPass123');
            if (!newTempPass) return;

            const users = getStoredData('users', []);
            const targetUser = users.find(u => u.email.toLowerCase() === userEmail.toLowerCase());
            if (!targetUser) {
                alert('User email not found in database!');
                return;
            }

            targetUser.password = newTempPass;
            if (!targetUser.notifications) targetUser.notifications = [];
            targetUser.notifications.unshift({
                id: 'notif_' + Date.now(),
                title: '🔑 Password Reset Successful',
                text: `Supreme Admin has resolved your recovery ticket and reset your temporary password to: "${newTempPass}". Please log in and update it immediately in your Account Settings!`,
                time: new Date().toLocaleString(),
                read: false
            });
            await saveCloudItem('users', targetUser.id, targetUser);

            const tickets = getStoredData('recovery_tickets', []);
            const ticket = tickets.find(t => t.id === ticketId);
            if (ticket) {
                ticket.status = 'Password Sent ✅';
                ticket.messages.push({ sender: 'DR Loom (Supreme Admin)', text: `[SYSTEM] Your password has been successfully reset. Your temporary password is: "${newTempPass}". Please log in and change your password immediately in Account Settings!`, time: new Date().toLocaleTimeString() });
                await saveCloudItem('recovery_tickets', ticket.id, ticket);
            }
            alert('Temporary password issued, ticket marked as Password Sent ✅!');
            render();
        }

        async function markTicketFinished(ticketId) {
            const tickets = getStoredData('recovery_tickets', []);
            const ticket = tickets.find(t => t.id === ticketId);
            if (ticket) {
                ticket.status = 'Finished ✅';
                await saveCloudItem('recovery_tickets', ticket.id, ticket);
            }
            alert('Recovery ticket marked as Finished ✅!');
            render();
        }

        async function sendDirectPersonalMail(userId) {
            const users = getStoredData('users', []);
            const targetUser = users.find(u => u.id === userId);
            if (!targetUser) return;

            const subject = prompt(`Send Direct Mail to ${targetUser.name} (${targetUser.email})\nEnter Mail Subject:`, 'Important Notice from Supreme Admin');
            if (!subject) return;

            const message = prompt(`Enter Mail Message for ${targetUser.name}:`, 'Hello, this is a personal message from Supreme Admin.');
            if (!message) return;

            if (!targetUser.notifications) targetUser.notifications = [];
            targetUser.notifications.unshift({
                id: 'notif_' + Date.now(),
                title: `📨 Direct Mail: ${subject}`,
                text: message,
                time: new Date().toLocaleString(),
                read: false
            });
            await saveCloudItem('users', targetUser.id, targetUser);

            if (currentUser && currentUser.id === userId) {
                currentUser = targetUser;
            }

            alert(`Personal mail successfully sent and delivered to ${targetUser.name}'s mailbox!`);
            render();
        }

        async function deleteReport(reportId) {
            if (!confirm('Delete this report?')) return;
            await deleteCloudItem('reports', reportId);
            alert('Report dismissed and deleted.');
            render();
        }

        async function deleteUserCompletely(userId) {
            const users = getStoredData('users', []);
            const targetUser = users.find(u => u.id === userId);
            if (!targetUser) return;

            if (!confirm(`🛑 WARNING: Are you sure you want to permanently DELETE user "${targetUser.name}" (${targetUser.email})?`)) return;

            await deleteCloudItem('users', userId);

            const novels = getStoredData('novels', []);
            for (let n of novels.filter(n => n.authorId === userId)) {
                await deleteCloudItem('novels', n.id);
            }

            alert(`User "${targetUser.name}" has been permanently deleted from NovelVerse.`);
            render();
        }

        function stealthInspectUser(userId) {
            const users = getStoredData('users', []);
            const targetUser = users.find(u => u.id === userId);
            if (!targetUser) {
                alert('User not found!');
                return;
            }

            adminImpersonator = currentUser;
            currentUser = targetUser;
            activeRole = targetUser.isAuthor ? 'author' : 'reader';
            navigate('reader_home', activeRole);
        }

        async function manualSuspendUser(userId) {
            const choice = prompt('Select suspension mode for this user:\n1 = Suspend Reader Mode Only\n2 = Suspend Author Studio Only\n3 = Suspend Both (Full Suspension)', '3');
            if (!choice) return;

            let mode = 'both';
            if (choice === '1') mode = 'reader';
            else if (choice === '2') mode = 'author';

            const users = getStoredData('users', []);
            const target = users.find(u => u.id === userId);
            if (target) {
                target.isSuspended = true;
                target.suspendMode = mode;
                if (!target.notifications) target.notifications = [];
                target.notifications.unshift({
                    id: 'notif_' + Date.now(),
                    title: '⚠️ Account Restriction Notice',
                    text: `Supreme Admin has manually restricted your account mode: [${mode.toUpperCase()}].`,
                    time: new Date().toLocaleString(),
                    read: false
                });
                await saveCloudItem('users', userId, target);
            }
            alert(`User successfully suspended under mode: ${mode.toUpperCase()}`);
            render();
        }

        async function unsuspendUser(userId) {
            if (!confirm('Lift all suspensions for this user?')) return;
            const users = getStoredData('users', []);
            const target = users.find(u => u.id === userId);
            if (target) {
                target.isSuspended = false;
                target.suspendMode = 'none';
                target.warningCount = 0;
                target.riskGrade = 'Low';
                if (!target.notifications) target.notifications = [];
                target.notifications.unshift({
                    id: 'notif_' + Date.now(),
                    title: '✅ Suspension Lifted',
                    text: 'Supreme Admin has fully restored your account permissions and cleared your restrictions.',
                    time: new Date().toLocaleString(),
                    read: false
                });
                await saveCloudItem('users', userId, target);
            }
            alert('User suspension lifted successfully!');
            render();
        }

        async function blockUserPermanently(userId) {
            if (!confirm('🛑 WARNING: This will permanently block this user and delete their novels. Proceed?')) return;
            const users = getStoredData('users', []);
            const target = users.find(u => u.id === userId);
            if (target) {
                target.isBlocked = true;
                target.isSuspended = true;
                target.suspendMode = 'both';
                if (!target.notifications) target.notifications = [];
                target.notifications.unshift({
                    id: 'notif_' + Date.now(),
                    title: '🛑 Permanent Account Ban',
                    text: 'Your account has been permanently blocked by Supreme Admin due to policy violations.',
                    time: new Date().toLocaleString(),
                    read: false
                });
                await saveCloudItem('users', userId, target);
            }

            const novels = getStoredData('novels', []);
            for (let n of novels.filter(n => n.authorId === userId)) {
                await deleteCloudItem('novels', n.id);
            }
            alert('User permanently blocked and content purged.');
            render();
        }

        async function unblockUser(userId) {
            if (!confirm('Unblock this user account?')) return;
            const users = getStoredData('users', []);
            const target = users.find(u => u.id === userId);
            if (target) {
                target.isBlocked = false;
                target.isSuspended = false;
                target.suspendMode = 'none';
                if (!target.notifications) target.notifications = [];
                target.notifications.unshift({
                    id: 'notif_' + Date.now(),
                    title: '✅ Account Unblocked',
                    text: 'Supreme Admin has unblocked your account. You can now log in normally.',
                    time: new Date().toLocaleString(),
                    read: false
                });
                await saveCloudItem('users', userId, target);
            }
            alert('User account unblocked!');
            render();
        }

        async function manualLowerRisk(userId) {
            const gradeChoice = prompt('Select new Risk Grade for this user:\n1 = Low\n2 = Moderate\n3 = High', '1');
            if (!gradeChoice) return;

            let newRisk = 'Low';
            let newWarnings = 0;
            if (gradeChoice === '2') { newRisk = 'Moderate'; newWarnings = 3; }
            else if (gradeChoice === '3') { newRisk = 'High'; newWarnings = 6; }

            const users = getStoredData('users', []);
            const target = users.find(u => u.id === userId);
            if (target) {
                target.riskGrade = newRisk;
                target.warningCount = newWarnings;
                if (!target.notifications) target.notifications = [];
                target.notifications.unshift({
                    id: 'notif_' + Date.now(),
                    title: '🛡️ Risk Level Adjusted',
                    text: `Supreme Admin has manually adjusted your account risk level to [${newRisk} Risk].`,
                    time: new Date().toLocaleString(),
                    read: false
                });
                await saveCloudItem('users', userId, target);
            }
            alert(`User risk successfully updated to ${newRisk}!`);
            render();
        }

        async function recoverUserPassword(userId) {
            const users = getStoredData('users', []);
            const target = users.find(u => u.id === userId);
            if (!target) return;

            const newPass = prompt(`Password Recovery for "${target.name}" (${target.email})\nEnter a new password:`, 'newpassword123');
            if (!newPass) return;

            target.password = newPass;
            if (!target.notifications) target.notifications = [];
            target.notifications.unshift({
                id: 'notif_' + Date.now(),
                title: '🔑 Password Reset By Admin',
                text: `Supreme Admin has manually reset your account password. Your new temporary password is: "${newPass}". Please change it in your Account Settings.`,
                time: new Date().toLocaleString(),
                read: false
            });
            await saveCloudItem('users', userId, target);
            alert(`Password successfully reset for ${target.name}.\nNew Password: ${newPass}`);
            render();
        }

        async function submitReport(targetType, targetId, targetName, authorId = '', authorName = '') {
            const reason = prompt(`Reason for reporting this ${targetType} ("${targetName}"):`);
            if (!reason) return;

            if (!authorName || authorName === 'Unknown') {
                const novels = getStoredData('novels', []);
                const foundNovel = novels.find(n => n.id === targetId || n.title === targetName);
                if (foundNovel) {
                    authorName = foundNovel.authorName;
                    authorId = foundNovel.authorId;
                }
            }

            const newReport = {
                id: 'rep_' + Date.now(),
                reporterName: currentUser.name,
                targetType,
                targetId,
                targetName,
                authorId,
                authorName: authorName || 'Unknown',
                reason,
                time: new Date().toLocaleString()
            };
            await saveCloudItem('reports', newReport.id, newReport);
            alert(`Report submitted successfully to admins.`);
            render();
        }

        async function sendWarningMail(userId) {
            const warningBody = prompt('Enter official warning message for this user:');
            if (!warningBody) return;

            const users = getStoredData('users', []);
            const target = users.find(u => u.id === userId);
            if (target) {
                target.warningCount = (target.warningCount || 0) + 1;
                if (target.warningCount >= 6) {
                    target.riskGrade = 'High';
                    target.isSuspended = true;
                    target.suspendMode = 'both';
                } else if (target.warningCount >= 3) {
                    target.riskGrade = 'Moderate';
                } else {
                    target.riskGrade = 'Low';
                }

                if (!target.notifications) target.notifications = [];
                let penaltyText = '';
                if (target.warningCount === 3) penaltyText = '\n\n⚠️ PENALTY: Your account has received a warning strike.';
                if (target.warningCount >= 6) penaltyText = '\n\n🛑 HIGH RISK PENALTY: Your account has been fully restricted.';

                target.notifications.unshift({
                    id: 'notif_' + Date.now(),
                    title: `⚠️ OFFICIAL WARNING (Warning #${target.warningCount})`,
                    text: `${warningBody}${penaltyText}`,
                    time: new Date().toLocaleString(),
                    read: false
                });
                await saveCloudItem('users', userId, target);
            }
            alert('Warning mail sent with template signature DR Loom!');
            render();
        }

        async function postAnnouncement(e) {
            e.preventDefault();
            const title = document.getElementById('ann-title').value;
            const content = document.getElementById('ann-content').value;

            const newAnn = {
                id: 'ann_' + Date.now(),
                title,
                content,
                time: new Date().toLocaleString()
            };
            await saveCloudItem('announcements', newAnn.id, newAnn);

            const users = getStoredData('users', []);
            for (let u of users) {
                if (!u.notifications) u.notifications = [];
                u.notifications.unshift({
                    id: 'notif_' + Date.now(),
                    title: `📢 Announcement: ${title}`,
                    text: content,
                    time: new Date().toLocaleTimeString(),
                    read: false
                });
                await saveCloudItem('users', u.id, u);

            alert('Announcement posted successfully!');
            document.getElementById('ann-title').value = '';
            document.getElementById('ann-content').value = '';
            render();
        }

        async function deleteNovel(novelId) {
            if (!confirm('Delete this novel?')) return;
            await deleteCloudItem('novels', novelId);
            render();
        }

        async function openNotificationModal(notifId) {
            openedNotificationId = notifId;
            if (currentUser && currentUser.notifications) {
                currentUser.notifications = currentUser.notifications.map(n => {
                    if (n.id === notifId) n.read = true;
                    return n;
                });
                await saveCloudItem('users', currentUser.id, currentUser);
            }
            render();
        }

        async function createNovel(e) {
            e.preventDefault();
            const title = document.getElementById('novel-title').value.trim();
            const genre = document.getElementById('novel-genre').value.trim();
            const cover = document.getElementById('novel-cover').value.trim() || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=500&auto=format&fit=crop&q=60';
            const synopsis = document.getElementById('novel-synopsis').value.trim();

            const newNovel = {
                id: 'novel_' + Date.now(),
                title,
                authorId: currentUser.id,
                authorName: currentUser.name,
                cover,
                genre,
                synopsis,
                status: 'Ongoing',
                chapters: []
            };

            await saveCloudItem('novels', newNovel.id, newNovel);
            alert('Novel published successfully!');
            document.getElementById('novel-form-container').classList.add('hidden');
            render();
        }

        async function addChapter(e) {
            e.preventDefault();
            const title = document.getElementById('ch-title').value.trim();
            const content = document.getElementById('ch-content').value.trim();

            const novels = getStoredData('novels', []);
            const novel = novels.find(n => n.id === editingNovelId);
            if (novel) {
                if (!novel.chapters) novel.chapters = [];
                novel.chapters.push({ id: 'ch_' + Date.now(), title, content });
                await saveCloudItem('novels', novel.id, novel);
                alert('Chapter published successfully!');
                render();
            }
        }

        async function postComment(e) {
            e.preventDefault();
            const input = document.getElementById('comment-text');
            const text = input.value.trim();
            if (!text) return;

            const newComment = {
                id: 'com_' + Date.now(),
                chapterId: selectedChapterId,
                userId: currentUser.id,
                userName: currentUser.name,
                text,
                time: new Date().toLocaleTimeString(),
                reply: ''
            };

            await saveCloudItem('comments', newComment.id, newComment);
            input.value = '';
            render();
        }

        async function authorReplyComment(commentId) {
            const replyText = prompt('Enter your reply as the author:');
            if (!replyText) return;

            const comments = getStoredData('comments', []);
            const comment = comments.find(c => c.id === commentId);
            if (comment) {
                comment.reply = replyText;
                await saveCloudItem('comments', comment.id, comment);
                render();
            }
        }

                n.title.toLowerCase().includes(readerNovelSearchQuery.toLowerCase()) ||
                n.genre.toLowerCase().includes(readerNovelSearchQuery.toLowerCase()) ||
                n.authorName.toLowerCase().includes(readerNovelSearchQuery.toLowerCase())
            );

            return `
                ${renderNavbar()}
                <div class="flex-1 max-w-6xl w-full mx-auto px-6 py-8">
                    ${isAdmin ? `
                        <div class="mb-6">
                            <button onclick="navigate('admin_home')" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold px-4 py-2 rounded-lg transition inline-flex items-center space-x-2">
                                <i class="fa-solid fa-arrow-left"></i>
                                <span>← Back to Admin Dashboard</span>
                            </button>
                        </div>
                    ` : ''}

                    ${announcements.length > 0 ? `
                        <div class="bg-indigo-950/40 border border-indigo-800/50 rounded-xl p-4 mb-8 flex items-center space-x-3">
                            <i class="fa-solid fa-bullhorn text-indigo-400 text-xl"></i>
                            <div class="flex-1">
                                <span class="text-xs font-bold text-indigo-400 uppercase">Announcement</span>
                                <p class="text-sm font-bold text-white">${announcements[0].title}</p>
                                <p class="text-xs text-slate-300">${announcements[0].content}</p>

                        </div>
                    ` : ''}

                    <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
                        <h1 class="text-3xl font-bold text-white">Explore Free Novels</h1>
                        <div class="w-full md:w-80 relative">
                            <i class="fa-solid fa-search absolute left-3.5 top-3 text-slate-400 text-sm"></i>
                            <input type="text" value="${readerNovelSearchQuery}" oninput="readerNovelSearchQuery = this.value; render();" placeholder="Search novels..." class="w-full bg-slate-900 border border-slate-800 rounded-xl pl-10 pr-4 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                        ${filteredNovels.length === 0 ? '<p class="text-slate-500 text-sm italic col-span-full">No novels found.</p>' : ''}
                        ${filteredNovels.map(novel => `
                            <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden group flex flex-col justify-between">
                                <div class="cursor-pointer" onclick="selectedNovelId = '${novel.id}'; navigate('reader_novel');">
                                    <img src="${novel.cover}" alt="${novel.title}" class="h-48 w-full object-cover group-hover:scale-105 transition duration-300">
                                    <div class="p-4">
                                        <span class="text-xs font-semibold text-indigo-400 uppercase">${novel.genre}</span>
                                        <h3 class="font-bold text-white text-base mt-1 line-clamp-1">${novel.title}</h3>
                                        <p class="text-xs text-slate-400 mt-1">By ${novel.authorName}</p>
                                    </div>
                                </div>
                                <div class="px-4 pb-4 flex justify-between items-center text-xs border-t border-slate-800/60 pt-2">
                                    <span class="text-slate-500">${(novel.chapters || []).length} Chapters</span>
                                    <button onclick="submitReport('Author', '${novel.authorId}', '${novel.authorName}', '${novel.authorId}', '${novel.authorName}')" class="text-red-400 hover:underline"><i class="fa-solid fa-flag mr-1"></i> Report Author</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderReaderNovel() {
            const novels = getStoredData('novels', []);
            const novel = novels.find(n => n.id === selectedNovelId);
            if (!novel) return renderReaderHome();

            return `
                ${renderNavbar()}
                <div class="flex-1 max-w-4xl w-full mx-auto px-6 py-8">
                    <button onclick="navigate('reader_home')" class="text-sm text-indigo-400 hover:underline mb-6 inline-block">
                        <i class="fa-solid fa-arrow-left mr-1"></i> Back to Library
                    </button>
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 md:p-8 flex flex-col md:flex-row gap-6 mb-8 relative">
                        <button onclick="submitReport('Novel', '${novel.id}', '${novel.title}', '${novel.authorId}', '${novel.authorName}')" class="absolute top-4 right-4 text-xs text-red-400 bg-red-950/40 border border-red-500/30 px-3 py-1.5 rounded-lg">
                            <i class="fa-solid fa-flag mr-1"></i> Report Novel
                        </button>
                        <img src="${novel.cover}" class="w-full md:w-48 h-64 object-cover rounded-xl shadow-md">
                        <div>
                            <span class="text-xs px-2.5 py-1 rounded-full bg-indigo-950 border border-indigo-800 text-indigo-300 font-medium">${novel.genre}</span>
                            <h1 class="text-2xl md:text-3xl font-bold text-white mt-3">${novel.title}</h1>
                            <p class="text-sm text-slate-400 mt-1">Author: <span class="text-slate-200 font-medium">${novel.authorName}</span></p>
                            <p class="text-slate-300 text-sm mt-4 leading-relaxed">${novel.synopsis}</p>
                        </div>
                    </div>

                    <h2 class="text-xl font-bold text-white mb-4">Chapters (${(novel.chapters || []).length})</h2>
                    <div class="space-y-3">
                        ${(!novel.chapters || novel.chapters.length === 0) ? '<p class="text-slate-500 text-sm italic">No chapters published yet.</p>' : ''}
                        ${(novel.chapters || []).map((ch, index) => `
                            <div class="bg-slate-900 border border-slate-800 hover:border-indigo-500 p-4 rounded-xl flex justify-between items-center transition">
                                <span onclick="selectedChapterId = '${ch.id}'; navigate('reader_read');" class="text-sm font-medium text-slate-200 cursor-pointer flex-1">Chapter ${index + 1}: ${ch.title}</span>
                                <button onclick="submitReport('Chapter', '${ch.id}', '${ch.title}', '${novel.authorId}', '${novel.authorName}')" class="text-xs text-red-400 hover:bg-red-950/40 px-2.5 py-1 rounded border border-red-500/20">
                                    <i class="fa-solid fa-flag"></i> Report
                                </button>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderReaderRead() {
            const novels = getStoredData('novels', []);
            const novel = novels.find(n => n.id === selectedNovelId);
            if (!novel) return renderReaderHome();
            
            const chapters = novel.chapters || [];
            const chapterIndex = chapters.findIndex(ch => ch.id === selectedChapterId);
            const chapter = chapters[chapterIndex];
            if (!chapter) return renderReaderNovel();

            const comments = getStoredData('comments', []).filter(c => c.chapterId === chapter.id);
            const prevChapter = chapterIndex > 0 ? chapters[chapterIndex - 1] : null;
            const nextChapter = chapterIndex < chapters.length - 1 ? chapters[chapterIndex + 1] : null;

            return `
                ${renderNavbar()}
                <div class="flex-1 max-w-3xl w-full mx-auto px-6 py-8">
                    <button onclick="navigate('reader_novel')" class="text-sm text-indigo-400 hover:underline mb-6 inline-block">
                        <i class="fa-solid fa-arrow-left mr-1"></i> Back to Novel Details
                    </button>
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-xl mb-6 relative">
                        <button onclick="submitReport('Chapter', '${chapter.id}', '${chapter.title}', '${novel.authorId}', '${novel.authorName}')" class="absolute top-6 right-6 text-xs text-red-400 bg-red-950/40 border border-red-500/30 px-3 py-1.5 rounded-lg">
                            <i class="fa-solid fa-flag mr-1"></i> Report Chapter
                        </button>
                        <span class="text-xs text-indigo-400 font-medium uppercase tracking-wider">${novel.title}</span>
                        <h1 class="text-2xl font-bold text-white mt-1 mb-6">${chapter.title}</h1>
                        <hr class="border-slate-800 mb-6">
                        <div class="text-slate-300 leading-loose whitespace-pre-line text-base">
                            ${chapter.content}
                        </div>
                    </div>

                    <div class="flex justify-between items-center mb-8 bg-slate-900 border border-slate-800 p-4 rounded-xl">
                        ${prevChapter ? `
                            <button onclick="selectedChapterId = '${prevChapter.id}'; render(); window.scrollTo(0,0);" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold px-4 py-2.5 rounded-lg transition flex items-center space-x-2">
                                <i class="fa-solid fa-chevron-left"></i><span>Previous Chapter</span>
                            </button>
                        ` : '<span></span>'}
                        ${nextChapter ? `
                            <button onclick="selectedChapterId = '${nextChapter.id}'; render(); window.scrollTo(0,0);" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-4 py-2.5 rounded-lg transition flex items-center space-x-2 ml-auto">
                                <span>Next Chapter</span><i class="fa-solid fa-chevron-right"></i>
                            </button>
                        ` : '<span class="text-xs text-slate-500 italic ml-auto">Latest Chapter</span>'}
                    </div>

                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
                        <h3 class="text-lg font-bold text-white mb-4"><i class="fa-solid fa-comments text-indigo-400 mr-2"></i> Comments (${comments.length})</h3>
                        <form onsubmit="postComment(event)" class="mb-6 space-y-3">
                            <textarea id="comment-text" rows="2" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-white text-sm" placeholder="Share your thoughts..."></textarea>
                            <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-4 py-2 rounded-lg">Post Comment</button>
                        </form>
                        <div class="space-y-3">
                            ${comments.length === 0 ? '<p class="text-slate-500 text-sm italic">No comments yet.</p>' : ''}
                            ${comments.map(c => `
                                <div class="bg-slate-950 border border-slate-800 p-3.5 rounded-xl">
                                    <div class="flex justify-between items-center mb-1">
                                        <span class="text-xs font-bold text-indigo-300">${c.userName}</span>
                                        <span class="text-[10px] text-slate-500">${c.time}</span>
                                    </div>
                                    <p class="text-xs text-slate-300">${c.text}</p>
                                    ${c.reply ? `<p class="text-xs text-purple-400 mt-2 bg-purple-950/30 p-2 rounded border border-purple-800/30"><b>Author Reply:</b> ${c.reply}</p>` : ''}
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderAuthorHome() {
            if (activeRole !== 'author' && currentUser.role !== 'admin' && currentUser.role !== 'co-admin') {
                navigate('reader_home', 'reader');
                return '';
            }

            const novels = getStoredData('novels', []);
            const myNovels = novels.filter(n => n.authorId === currentUser.id);

            return `
                ${renderNavbar()}
                <div class="flex-1 max-w-6xl w-full mx-auto px-6 py-8">
                    <div class="flex justify-between items-center mb-8">
                        <div>

                        <form onsubmit="createNovel(event)" class="space-y-4">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div><label class="block text-xs text-slate-400 mb-1">Title</label><input type="text" id="novel-title" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-white"></div>
                                <div><label class="block text-xs text-slate-400 mb-1">Genre</label><input type="text" id="novel-genre" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-white"></div>
                            </div>
                            <div><label class="block text-xs text-slate-400 mb-1">Cover Image URL</label><input type="url" id="novel-cover" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-white"></div>
                            <div><label class="block text-xs text-slate-400 mb-1">Synopsis</label><textarea id="novel-synopsis" rows="3" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-white"></textarea></div>
                            <button type="submit" class="bg-indigo-600 text-white font-medium px-4 py-2 rounded-lg text-sm">Publish Novel</button>
                        </form>
                    </div>

                    <h2 class="text-xl font-bold text-white mb-4">Your Published Novels (${myNovels.length})</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        ${myNovels.map(novel => `
                            <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden flex flex-col justify-between">
                                <div class="p-6">
                                    <span class="text-xs font-semibold text-indigo-400 uppercase">${novel.genre}</span>
                                    <h3 class="font-bold text-white text-lg mt-1">${novel.title}</h3>
                                    <p class="text-xs text-slate-400 mt-2 line-clamp-2">${novel.synopsis}</p>
                                </div>
                                <div class="bg-slate-950 px-6 py-3 border-t border-slate-800 flex justify-between items-center">
                                    <button onclick="editingNovelId = '${novel.id}'; navigate('author_edit');" class="text-xs text-indigo-400 hover:underline"><i class="fa-solid fa-pen-to-square mr-1"></i> Edit Chapters</button>
                                    <button onclick="deleteNovel('${novel.id}')" class="text-xs text-red-400 hover:underline"><i class="fa-solid fa-trash"></i></button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderAuthorEdit() {
            const novels = getStoredData('novels', []);
            const novel = novels.find(n => n.id === editingNovelId);
            if (!novel) return renderAuthorHome();

            return `
                ${renderNavbar()}
                <div class="flex-1 max-w-4xl w-full mx-auto px-6 py-8">
                    <button onclick="navigate('author_home')" class="text-sm text-indigo-400 hover:underline mb-6 inline-block"><i class="fa-solid fa-arrow-left mr-1"></i> Back</button>
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 mb-8">
                        <h1 class="text-2xl font-bold text-white">Editing: ${novel.title}</h1>

                        <form onsubmit="addChapter(event)" class="space-y-4">
                            <div><label class="block text-xs text-slate-400 mb-1">Chapter Title</label><input type="text" id="ch-title" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-white"></div>
                            <div><label class="block text-xs text-slate-400 mb-1">Content</label><textarea id="ch-content" rows="8" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-white"></textarea></div>
                            <button type="submit" class="bg-indigo-600 text-white font-medium px-5 py-2.5 rounded-lg text-sm">Publish Chapter</button>
                        </form>
                    </div>
                </div>
            `;
        }

        function renderAdminHome() {
            const users = getStoredData('users', []);
            const regularUsers = users.filter(u => u.role !== 'admin' && u.role !== 'co-admin');
            const novels = getStoredData('novels', []);
            const reports = getStoredData('reports', []);
            const announcements = getStoredData('announcements', []);
            const recoveryTickets = getStoredData('recovery_tickets', []);

            const activeTicket = recoveryTickets.find(t => t.id === activeRecoveryTicketId);

            return `
                ${renderNavbar()}
                <div class="flex-1 max-w-6xl w-full mx-auto px-6 py-8">
                    <div class="mb-6"><h1 class="text-3xl font-bold text-white">Platform Administration</h1></div>
                    
                    <div class="flex space-x-2 border-b border-slate-800 mb-8 pb-2 overflow-x-auto">
                        <button onclick="adminActiveTab = 'overview'; render();" class="px-4 py-2 rounded-lg text-sm font-semibold ${adminActiveTab === 'overview' ? 'bg-indigo-600 text-white' : 'bg-slate-900 text-slate-400'}">Overview</button>
                        <button onclick="adminActiveTab = 'users'; render();" class="px-4 py-2 rounded-lg text-sm font-semibold ${adminActiveTab === 'users' ? 'bg-indigo-600 text-white' : 'bg-slate-900 text-slate-400'}">Users (${regularUsers.length})</button>
                        <button onclick="adminActiveTab = 'recovery'; render();" class="px-4 py-2 rounded-lg text-sm font-semibold ${adminActiveTab === 'recovery' ? 'bg-indigo-600 text-white' : 'bg-slate-900 text-slate-400'}">Recovery (${recoveryTickets.length})</button>
                        <button onclick="adminActiveTab = 'content'; render();" class="px-4 py-2 rounded-lg text-sm font-semibold ${adminActiveTab === 'content' ? 'bg-indigo-600 text-white' : 'bg-slate-900 text-slate-400'}">Reports (${reports.length})</button>
                        <button onclick="adminActiveTab = 'announcements'; render();" class="px-4 py-2 rounded-lg text-sm font-semibold ${adminActiveTab === 'announcements' ? 'bg-indigo-600 text-white' : 'bg-slate-900 text-slate-400'}">Announcements</button>
                    </div>

                    ${activeTicket ? `
                        <div class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div class="bg-slate-900 border border-indigo-500/50 p-6 rounded-2xl w-full max-w-lg relative shadow-2xl flex flex-col h-[520px]">
                                <button onclick="activeRecoveryTicketId = null; render();" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
                                <div class="flex justify-between items-center mb-2">
                                    <h3 class="text-lg font-bold text-white">Ticket: ${activeTicket.email}</h3>
                                    <button onclick="resolveRecoveryTicket('${activeTicket.id}')" class="bg-emerald-600 text-white text-xs px-3 py-1.5 rounded font-bold">Issue Temp Password</button>
                                </div>
                                <div class="flex-1 bg-slate-950 border border-slate-800 rounded-xl p-4 overflow-y-auto space-y-3 mb-4">
                                    ${activeTicket.messages.map(m => `
                                        <div class="p-2.5 rounded-lg text-xs ${m.sender.includes('DR Loom') ? 'bg-indigo-950 text-indigo-200' : 'bg-slate-900 text-slate-300'}">
                                            <span class="font-bold">${m.sender}:</span> <p>${m.text}</p>
                                        </div>
                                    `).join('')}
                                </div>
                                <form onsubmit="sendRecoveryChatMessage(event)" class="flex space-x-2">
                                    <input type="text" id="ticket-chat-input" required placeholder="Type reply..." class="flex-1 bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white text-xs">
                                    <button type="submit" class="bg-indigo-600 text-white text-xs px-4 py-2 rounded-lg font-bold">Send</button>
                                </form>
                            </div>
                        </div>
                    ` : ''}

                    ${adminActiveTab === 'overview' ? `
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                            <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl"><span class="text-xs text-slate-400">Total Users</span><h3 class="text-3xl font-bold text-white mt-2">${regularUsers.length}</h3></div>
                            <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl"><span class="text-xs text-slate-400">Published Novels</span><h3 class="text-3xl font-bold text-white mt-2">${novels.length}</h3></div>
                            <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl"><span class="text-xs text-slate-400">Reports</span><h3 class="text-3xl font-bold text-red-400 mt-2">${reports.length}</h3></div>
                        </div>
                    ` : ''}

                    ${adminActiveTab === 'users' ? `
                        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4">
                            <h2 class="text-lg font-bold text-white mb-4">User Management</h2>
                            ${regularUsers.map(u => renderUserCard(u, novels)).join('')}
                        </div>
                    ` : ''}

                    ${adminActiveTab === 'recovery' ? `
                        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
                            <h2 class="text-lg font-bold text-white mb-4">Password Recovery Desk</h2>
                            <div class="space-y-3">
                                ${recoveryTickets.length === 0 ? '<p class="text-slate-500 text-sm italic">No requests.</p>' : ''}
                                ${recoveryTickets.map(t => `
                                    <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl flex justify-between items-center">
                                        <div>
                                            <span class="text-xs px-2 py-0.5 rounded ${t.status.includes('Finished') ? 'bg-emerald-950 text-emerald-400' : 'bg-amber-950 text-amber-400'} font-bold uppercase">${t.status}</span>
                                            <h4 class="text-sm font-bold text-white mt-1">${t.email}</h4>
                                            <p class="text-xs text-slate-300">Proof: "${t.proof}"</p>
                                        </div>
                                        <div class="flex space-x-2">
                                            ${!t.status.includes('Finished') ? `<button onclick="markTicketFinished('${t.id}')" class="bg-emerald-600 text-white text-xs px-3 py-2 rounded font-bold">Finish ✅</button>` : ''}
                                            <button onclick="activeRecoveryTicketId = '${t.id}'; render();" class="bg-indigo-600 text-white text-xs px-3 py-2 rounded font-bold">Chat →</button>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    ` : ''}

                    ${adminActiveTab === 'content' ? `
                        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
                            <h2 class="text-lg font-bold text-white mb-4">Reports</h2>
                            <div class="space-y-3">
                                ${reports.length === 0 ? '<p class="text-slate-500 text-sm italic">No reports.</p>' : ''}
                                ${reports.map(r => `
                                    <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl flex justify-between items-center">
                                        <div><span class="text-xs text-red-400 font-bold">${r.targetType}: ${r.targetName}</span><p class="text-xs text-slate-300">${r.reason}</p></div>
                                        <button onclick="deleteReport('${r.id}')" class="bg-red-600/20 text-red-300 text-xs px-3 py-2 rounded">Delete</button>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    ` : ''}

                    ${adminActiveTab === 'announcements' ? `
                        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
                            <h2 class="text-lg font-bold text-white mb-4">Post Announcement</h2>
                            <form onsubmit="postAnnouncement(event)" class="space-y-4">
                                <input type="text" id="ann-title" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-white text-sm" placeholder="Title">

                                <button type="submit" class="bg-indigo-600 text-white text-xs px-5 py-2.5 rounded-lg">Broadcast</button>
                            </form>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function renderUserCard(u, novels) {
            const userNovelsCount = novels.filter(n => n.authorId === u.id).length;
            const isMenuOpen = openDropdownUserId === u.id;

            return `
                <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4 relative">
                    <div>
                        <div class="flex items-center space-x-2">
                            <p class="text-sm font-bold text-white">${u.name}</p>
                            <span class="text-xs px-2 py-0.5 rounded bg-indigo-950 border border-indigo-800 text-indigo-300">${u.isAuthor ? 'Author' : 'Reader'}</span>
                        </div>
                        <p class="text-xs text-slate-400">${u.email}</p>
                        <div class="flex items-center gap-3 mt-2 text-[11px] text-slate-300 bg-slate-900/60 px-3 py-1.5 rounded-lg border border-slate-800">
                            <span>Risk: <b class="${u.riskGrade === 'High' ? 'text-red-400' : 'text-emerald-400'}">${u.riskGrade}</b></span> • 
                            <span>Novels: ${userNovelsCount}</span>
                        </div>
                    </div>
                    <div class="relative dropdown-container">
                        <button onclick="openDropdownUserId = ${isMenuOpen ? 'null' : `'${u.id}'`}; render();" class="bg-slate-900 text-slate-300 border border-slate-700 px-3 py-1.5 rounded-lg text-sm font-bold">
                            <i class="fa-solid fa-ellipsis-vertical"></i>
                        </button>
                        ${isMenuOpen ? `
                            <div class="absolute right-0 mt-2 w-48 bg-slate-900 border border-slate-800 rounded-xl shadow-2xl z-50 py-1.5 flex flex-col text-xs">
                                <button onclick="openDropdownUserId = null; sendDirectPersonalMail('${u.id}');" class="text-left px-4 py-2 hover:bg-slate-800 text-indigo-300">Email User</button>
                                <button onclick="openDropdownUserId = null; manualLowerRisk('${u.id}');" class="text-left px-4 py-2 hover:bg-slate-800 text-purple-300">Lower Risk</button>
                                <button onclick="openDropdownUserId = null; recoverUserPassword('${u.id}');" class="text-left px-4 py-2 hover:bg-slate-800 text-amber-300">Reset Pass</button>
                                <button onclick="openDropdownUserId = null; deleteUserCompletely('${u.id}');" class="text-left px-4 py-2 hover:bg-red-950/40 text-red-400 font-bold">Delete User</button>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        // --- INITIAL BOOTSTRAP ---
        async function init() {
            await fetchCloudData();
            render();
        }
        init();
    </script>
</body>
</html>
