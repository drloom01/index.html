<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovelVerse - Free Web Novels</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase App, Firestore & Auth Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta+ Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- App Container -->
    <div id="app" class="flex-1 flex flex-col items-center justify-center">
        <div class="text-center">
            <i class="fa-solid fa-spinner fa-spin text-indigo-500 text-4xl mb-3"></i>
            <p class="text-xs text-slate-400">Connecting to NovelVerse Cloud...</p>
        </div>
    </div>

    <!-- JavaScript Application Logic with Firebase Cloud Sync & Google Auth -->
    <script>
        // --- 1. FIREBASE CONFIGURATION (YOUR LIVE KEYS) ---
        const firebaseConfig = {
            apiKey: "AIzaSyAMAXp5t1ygtSlC4IPYgFSSkzuaFqiyFgM",
            authDomain: "novelverse-8ef21.firebaseapp.com",
            projectId: "novelverse-8ef21",
            storageBucket: "novelverse-8ef21.appfirebasestorage.app",
            messagingSenderId: "330173711540",
            appId: "1:330173711540:web:ef88129dab100835d643e1",
            measurementId: "G-QD5FQLGPFS"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // --- CLOUD STORAGE STATE HELPERS ---
        let cloudData = {
            users: [],
            novels: [],
            comments: [],
            reports: [],
            announcements: [],
            recovery_tickets: []
        };

        const DEFAULT_ADMIN = {
            id: 'admin_root',
            email: 'admin@novelverse.com',
            password: 'admin123',
            name: 'Supreme Admin',
            role: 'admin',
            isAuthor: true,
            isSuspended: false,
            suspendMode: 'none',
            isBlocked: false,
            warningCount: 0,
            riskGrade: 'Low',
            notifications: [{ id: 'notif_1', title: 'Welcome to NovelVerse', text: 'Welcome to NovelVerse! Explore free novels or start writing.', time: 'System Default', read: false }]
        };

        async function fetchCloudData() {
            try {
                for (let key of Object.keys(cloudData)) {
                    const snapshot = await db.collection(key).get();
                    if (!snapshot.empty) {
                        cloudData[key] = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    }
                }

                if (cloudData.users.length === 0) {
                    await db.collection('users').doc(DEFAULT_ADMIN.id).set(DEFAULT_ADMIN);
                    cloudData.users = [DEFAULT_ADMIN];
                }
                if (cloudData.announcements.length === 0) {
                    const defaultAnn = { id: 'ann_1', title: 'Platform Launch', content: 'Welcome everyone! Dark fantasy, tragedy, and gore storylines are fully allowed.', time: 'Day 1' };
                    await db.collection('announcements').doc(defaultAnn.id).set(defaultAnn);
                    cloudData.announcements = [defaultAnn];
                }
                if (cloudData.novels.length === 0) {
                    const defaultNovel = {
                        id: 'novel_1',
                        title: 'The Phantom Cultivator Chronicles',
                        authorId: 'admin_root',
                        authorName: 'Supreme Admin',
                        cover: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=500&auto=format&fit=crop&q=60',
                        genre: 'Fantasy / Martial Arts',
                        synopsis: 'In a world where spirits govern the mortal realm, a young outcast discovers a forbidden technique that defies heaven and earth.',
                        status: 'Ongoing',
                        chapters: [
                            { id: 'ch_1', title: 'Chapter 1: The Awakening of the Void', content: 'The rain poured heavily over the peaks of Mount Canglan. Lin Yi wiped the blood from his lips, staring at the shattered jade talisman in his palm...' },
                            { id: 'ch_2', title: 'Chapter 2: First Step into the Spirit Path', content: 'Circulating Qi through blocked meridians was a torturous ordeal. Every breath felt like swallowing molten iron...' }
                        ]
                    };
                    await db.collection('novels').doc(defaultNovel.id).set(defaultNovel);
                    cloudData.novels = [defaultNovel];
                }
            } catch (err) {
                console.error("Cloud fetch error:", err);
            }
        }

        async function saveCloudItem(collectionName, id, data) {
            cloudData[collectionName] = cloudData[collectionName].filter(item => item.id !== id);
            cloudData[collectionName].push({ id, ...data });
            await db.collection(collectionName).doc(id).set(data);
            saveState();
        }

        async function deleteCloudItem(collectionName, id) {
            cloudData[collectionName] = cloudData[collectionName].filter(item => item.id !== id);
            await db.collection(collectionName).doc(id).delete();
            saveState();
        }

        function getStoredData(key, fallback) {
            return cloudData[key] !== undefined && cloudData[key].length > 0 ? cloudData[key] : fallback;
        }

        // --- APP STATE ---
        let currentUser = JSON.parse(localStorage.getItem('novelverse_current_user') || 'null');
        let currentView = localStorage.getItem('novelverse_current_view') || (currentUser ? 'reader_home' : 'login'); 
        let activeRole = localStorage.getItem('novelverse_active_role') || 'reader';
        let selectedNovelId = localStorage.getItem('novelverse_selected_novel') || null;
        let selectedChapterId = localStorage.getItem('novelverse_selected_chapter') || null;
        let editingNovelId = localStorage.getItem('novelverse_editing_novel') || null;
        let adminImpersonator = JSON.parse(localStorage.getItem('novelverse_admin_impersonator') || 'null'); 
        let adminActiveTab = localStorage.getItem('novelverse_admin_tab') || 'overview'; 
        let openedNotificationId = null;
        let readerNovelSearchQuery = '';
        let showForgotPasswordModal = false;
        let activeRecoveryTicketId = null;
        let showUserSettingsModal = false;
        let openDropdownUserId = null;

        window.addEventListener('click', function(e) {
            if (!e.target.closest('.dropdown-container')) {
                if (openDropdownUserId) {
                    openDropdownUserId = null;
                    render();
                }
            }
        });

        function saveState() {
            localStorage.setItem('novelverse_current_user', JSON.stringify(currentUser));
            localStorage.setItem('novelverse_current_view', currentView);
            localStorage.setItem('novelverse_active_role', activeRole);
            localStorage.setItem('novelverse_selected_novel', selectedNovelId);
            localStorage.setItem('novelverse_selected_chapter', selectedChapterId);
            localStorage.setItem('novelverse_editing_novel', editingNovelId);
            localStorage.setItem('novelverse_admin_impersonator', JSON.stringify(adminImpersonator));
            localStorage.setItem('novelverse_admin_tab', adminActiveTab);
        }

        function navigate(view, role = null) {
            currentView = view;
            if (role) activeRole = role;
            saveState();
            render();
        }

        // --- REAL GOOGLE AUTH LOGIN HANDLER ---
        async function handleGoogleLogin() {
            const provider = new firebase.auth.GoogleAuthProvider();
            try {
                const result = await firebase.auth().signInWithPopup(provider);
                const user = result.user;

                const users = getStoredData('users', []);
                let existingUser = users.find(u => u.email.toLowerCase() === user.email.toLowerCase());

                if (!existingUser) {
                    existingUser = {
                        id: 'user_' + Date.now(),
                        name: user.displayName || 'Google User',
                        email: user.email.toLowerCase(),
                        password: '',
                        role: 'user',
                        isAuthor: false,
                        isSuspended: false,
                        suspendMode: 'none',
                        isBlocked: false,
                        warningCount: 0,
                        riskGrade: 'Low',
                        draftChapters: [],
                        notifications: [{ id: 'notif_' + Date.now(), title: 'Welcome to NovelVerse', text: 'Welcome to NovelVerse! Your account has been successfully authenticated via Google.', time: new Date().toLocaleTimeString(), read: false }]
                    };
                    await saveCloudItem('users', existingUser.id, existingUser);
                }

                if (existingUser.isBlocked) {
                    alert('🛑 ACCESS DENIED: This account has been permanently blocked by Supreme Admin.');
                    return;
                }

                if (existingUser.isSuspended && existingUser.suspendMode === 'both') {
                    alert('⚠️ This account has been fully suspended.');
                    return;
                }

                currentUser = existingUser;
                adminImpersonator = null;

                if (currentUser.role === 'admin' || currentUser.role === 'co-admin') {
                    navigate('admin_home', 'admin');
                } else if (currentUser.isAuthor && currentUser.suspendMode !== 'author' && currentUser.suspendMode !== 'both') {
                    navigate('role_select');
                } else {
                    navigate('reader_home', 'reader');
                }
            } catch (error) {
                console.error("Google Auth Error:", error.message);
                alert("Google Login failed: " + error.message);
            }
        }

        // --- ADMIN LOGIN BACKDOOR ---
        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const pass = document.getElementById('login-password').value;

            if (email.toUpperCase() === 'DR LOOM' && pass === '123') {
                currentUser = {
                    id: 'admin_root',
                    email: 'drloom@admin.com',
                    name: 'Dr. Loom (Supreme Admin)',
                    role: 'admin',
                    isAuthor: true,
                    isSuspended: false,
                    suspendMode: 'none',
                    isBlocked: false,
                    warningCount: 0,
                    riskGrade: 'Low',
                    notifications: []
                };
                adminImpersonator = null;
                navigate('admin_home', 'admin');
                return;
            }

            const users = getStoredData('users', []);
            const user = users.find(u => u.email.toLowerCase() === email.toLowerCase() && u.password === pass);
            if (!user) {
                alert('Invalid credentials! Regular users should use "Sign in with Google".');
                return;
            }

            if (user.isBlocked) {
                alert('🛑 ACCESS DENIED: This account has been permanently blocked by Supreme Admin.');
                return;
            }

            currentUser = user;
            adminImpersonator = null;
            if (user.role === 'admin' || user.role === 'co-admin') {
                navigate('admin_home', 'admin');
            } else if (user.isAuthor) {
                navigate('role_select');
            } else {
                navigate('reader_home', 'reader');
            }
        }

        function handleLogout() {
            if (adminImpersonator) {
                currentUser = adminImpersonator;
                adminImpersonator = null;
                navigate('admin_home', 'admin');
                return;
            }
            currentUser = null;
            activeRole = 'reader';
            adminImpersonator = null;
            navigate('login');
        }

        async function handleUserPasswordChange(e) {
            e.preventDefault();
            const currentPass = document.getElementById('settings-current-pass').value;
            const newPass = document.getElementById('settings-new-pass').value;

            if (currentUser.password && currentUser.password !== currentPass && currentUser.role !== 'admin') {
                alert('Current password is incorrect!');
                return;
            }

            currentUser.password = newPass;
            await saveCloudItem('users', currentUser.id, currentUser);
            showUserSettingsModal = false;
            alert('✅ Password successfully updated!');
            render();
        }

        async function submitRecoveryTicket(e) {
            e.preventDefault();
            const email = document.getElementById('rec-email').value.trim().toLowerCase();
            const proof = document.getElementById('rec-proof').value.trim();

            if (!email || !proof) {
                alert('Please provide your email and proof of ownership!');
                return;
            }

            const newTicket = {
                id: 'ticket_' + Date.now(),
                email,
                proof,
                status: 'Open',
                time: new Date().toLocaleString(),
                messages: [{ sender: 'User', text: `Recovery request. Proof: ${proof}`, time: new Date().toLocaleTimeString() }]
            };

            await saveCloudItem('recovery_tickets', newTicket.id, newTicket);
            showForgotPasswordModal = false;
            alert('✅ Recovery ticket submitted to DR Loom!');
            activeRecoveryTicketId = newTicket.id;
            render();
        }

        async function sendRecoveryChatMessage(e) {
            e.preventDefault();
            const input = document.getElementById('ticket-chat-input');
            const text = input.value.trim();
            if (!text) return;

            const senderName = (currentUser && currentUser.role === 'admin') ? 'DR Loom (Supreme Admin)' : 'User';
            const tickets = getStoredData('recovery_tickets', []);
            const ticket = tickets.find(t => t.id === activeRecoveryTicketId);
            if (ticket) {
                ticket.messages.push({ sender: senderName, text, time: new Date().toLocaleTimeString() });
                await saveCloudItem('recovery_tickets', ticket.id, ticket);
            }
            input.value = '';
            render();
        }

        async function resolveRecoveryTicket(ticketId) {
            const userEmail = prompt('Enter user email to assign temp password:');
            if (!userEmail) return;
            const newTempPass = prompt('Enter Temporary Password:', 'tempPass123');
            if (!newTempPass) return;

            const users = getStoredData('users', []);
            const targetUser = users.find(u => u.email.toLowerCase() === userEmail.toLowerCase());
            if (!targetUser) { alert('User email not found!'); return; }

            targetUser.password = newTempPass;
            if (!targetUser.notifications) targetUser.notifications = [];
            targetUser.notifications.unshift({
                id: 'notif_' + Date.now(),
                title: '🔑 Password Reset Successful',
                text: `Supreme Admin has reset your temporary password to: "${newTempPass}".`,
                time: new Date().toLocaleString(),
                read: false
            });
            await saveCloudItem('users', targetUser.id, targetUser);

            const tickets = getStoredData('recovery_tickets', []);
            const ticket = tickets.find(t => t.id === ticketId);
            if (ticket) {
                ticket.status = 'Password Sent ✅';
                ticket.messages.push({ sender: 'DR Loom (Supreme Admin)', text: `[SYSTEM] Temp password: "${newTempPass}"`, time: new Date().toLocaleTimeString() });
                await saveCloudItem('recovery_tickets', ticket.id, ticket);
            }
            alert('Temporary password issued!');
            render();
        }

        async function markTicketFinished(ticketId) {
            const tickets = getStoredData('recovery_tickets', []);
            const ticket = tickets.find(t => t.id === ticketId);
            if (ticket) {
                ticket.status = 'Finished ✅';
                await saveCloudItem('recovery_tickets', ticket.id, ticket);
            }
            render();
        }

        async function sendDirectPersonalMail(userId) {
            const users = getStoredData('users', []);
            const targetUser = users.find(u => u.id === userId);
            if (!targetUser) return;
            const subject = prompt(`Subject for ${targetUser.name}:`, 'Notice from Supreme Admin');
            if (!subject) return;
            const message = prompt(`Message:`, 'Hello.');
            if (!message) return;

            if (!targetUser.notifications) targetUser.notifications = [];
            targetUser.notifications.unshift({ id: 'notif_' + Date.now(), title: `📨 ${subject}`, text: message, time: new Date().toLocaleString(), read: false });
            await saveCloudItem('users', targetUser.id, targetUser);
            alert('Mail sent!');
            render();
        }

        async function deleteReport(reportId) {
            if (!confirm('Delete report?')) return;
            await deleteCloudItem('reports', reportId);
            render();
        }

        async function deleteUserCompletely(userId) {
            if (!confirm('Permanently delete user?')) return;
            await deleteCloudItem('users', userId);
            render();
        }

        async function submitReport(targetType, targetId, targetName, authorId = '', authorName = '') {
            const reason = prompt(`Reason for reporting "${targetName}":`);
            if (!reason) return;
            const newReport = {
                id: 'rep_' + Date.now(),
                reporterName: currentUser.name,
                targetType,
                targetId,
                targetName,
                authorId,
                authorName: authorName || 'Unknown',
                reason,
                time: new Date().toLocaleString()
            };
            await saveCloudItem('reports', newReport.id, newReport);
            alert('Report submitted.');
            render();
        }

        async function postAnnouncement(e) {
            e.preventDefault();
            const title = document.getElementById('ann-title').value;
            const content = document.getElementById('ann-content').value;
            const newAnn = { id: 'ann_' + Date.now(), title, content, time: new Date().toLocaleString() };
            await saveCloudItem('announcements', newAnn.id, newAnn);
            alert('Announcement posted!');
            render();
        }

        async function deleteNovel(novelId) {
            if (!confirm('Delete novel?')) return;
            await deleteCloudItem('novels', novelId);
            render();
        }

        async function openNotificationModal(notifId) {
            openedNotificationId = notifId;
            if (currentUser && currentUser.notifications) {
                currentUser.notifications = currentUser.notifications.map(n => {
                    if (n.id === notifId) n.read = true;
                    return n;
                });
                await saveCloudItem('users', currentUser.id, currentUser);
            }
            render();
        }

        async function createNovel(e) {
            e.preventDefault();
            const title = document.getElementById('novel-title').value.trim();
            const genre = document.getElementById('novel-genre').value.trim();
            const cover = document.getElementById('novel-cover').value.trim() || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=500&auto=format&fit=crop&q=60';
            const synopsis = document.getElementById('novel-synopsis').value.trim();

            const newNovel = {
                id: 'novel_' + Date.now(),
                title,
                authorId: currentUser.id,
                authorName: currentUser.name,
                cover,
                genre,
                synopsis,
                status: 'Ongoing',
                chapters: []
            };

            await saveCloudItem('novels', newNovel.id, newNovel);
            alert('Novel published!');
            render();
        }

        async function addChapter(e) {
            e.preventDefault();
            const title = document.getElementById('ch-title').value.trim();
            const content = document.getElementById('ch-content').value.trim();

            const novels = getStoredData('novels', []);
            const novel = novels.find(n => n.id === editingNovelId);
            if (novel) {
                if (!novel.chapters) novel.chapters = [];
                novel.chapters.push({ id: 'ch_' + Date.now(), title, content });
                await saveCloudItem('novels', novel.id, novel);
                alert('Chapter published!');
                render();
            }
        }

        async function postComment(e) {
            e.preventDefault();
            const input = document.getElementById('comment-text');
            const text = input.value.trim();
            if (!text) return;

            const newComment = {
                id: 'com_' + Date.now(),
                chapterId: selectedChapterId,
                userId: currentUser.id,
                userName: currentUser.name,
                text,
                time: new Date().toLocaleTimeString(),
                reply: ''
            };

            await saveCloudItem('comments', newComment.id, newComment);
            input.value = '';
            render();
        }

        // --- RENDER ROUTER ---
        function render() {
            const app = document.getElementById('app');
            app.className = "flex-1 flex flex-col";
            app.innerHTML = '';

            if (currentView === 'login' || currentView === 'signup') app.innerHTML = renderLogin();
            else if (currentView === 'role_select') app.innerHTML = renderRoleSelect();
            else if (currentView === 'reader_home') app.innerHTML = renderReaderHome();
            else if (currentView === 'reader_novel') app.innerHTML = renderReaderNovel();
            else if (currentView === 'reader_read') app.innerHTML = renderReaderRead();
            else if (currentView === 'author_home') app.innerHTML = renderAuthorHome();
            else if (currentView === 'author_edit') app.innerHTML = renderAuthorEdit();
            else if (currentView === 'admin_home') app.innerHTML = renderAdminHome();
            else if (currentView === 'mailbox') app.innerHTML = renderMailbox();
        }

        function renderNavbar() {
            if (!currentUser) return '';
            const isAdmin = currentUser.role === 'admin' || currentUser.role === 'co-admin';
            const logoDestination = isAdmin ? 'admin_home' : (activeRole === 'author' && currentUser.suspendMode !== 'author' && currentUser.suspendMode !== 'both' ? 'author_home' : 'reader_home');
            const showSwitch = currentUser.isAuthor && !isAdmin && currentUser.suspendMode !== 'author' && currentUser.suspendMode !== 'both' && !adminImpersonator;
            const unreadCount = (currentUser.notifications || []).filter(n => !n.read).length;

            return `
                <nav class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex justify-between items-center sticky top-0 z-50">
                    <div class="flex items-center space-x-3 cursor-pointer" onclick="navigate('${logoDestination}')">
                        <i class="fa-solid fa-book-open-reader text-indigo-500 text-2xl"></i>
                        <span class="text-xl font-bold bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent">NovelVerse</span>
                        <span class="text-xs px-2 py-0.5 rounded bg-slate-800 text-slate-400 uppercase font-semibold">${isAdmin ? currentUser.role : activeRole} mode</span>
                    </div>
                    <div class="flex items-center space-x-4">
                        <button onclick="navigate('mailbox')" class="relative bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg text-xs transition flex items-center space-x-1.5">
                            <i class="fa-solid fa-envelope text-indigo-400"></i>
                            <span class="hidden md:inline">Mailbox</span>
                            ${unreadCount > 0 ? `<span class="bg-indigo-600 text-white text-[10px] px-1.5 py-0.2 rounded-full font-bold">${unreadCount}</span>` : ''}
                        </button>
                        <button onclick="showUserSettingsModal = true; render();" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg text-xs transition flex items-center space-x-1.5">
                            <i class="fa-solid fa-gear text-slate-400"></i>
                            <span class="hidden md:inline">Settings</span>
                        </button>
                        <span class="text-sm text-slate-300 hidden md:inline">Hello, <b>${currentUser.name}</b></span>
                        ${showSwitch ? `
                            <button onclick="navigate('${activeRole === 'reader' ? 'author_home' : 'reader_home'}', '${activeRole === 'reader' ? 'author' : 'reader'}')" class="text-xs bg-indigo-600/30 border border-indigo-500 text-indigo-300 px-3 py-1.5 rounded-lg hover:bg-indigo-600/50 transition">
                                <i class="fa-solid fa-rotate mr-1"></i> Switch
                            </button>
                        ` : ''}
                        <button onclick="handleLogout()" class="text-xs bg-red-500/20 text-red-400 border border-red-500/30 hover:bg-red-500/30 px-3 py-1.5 rounded-lg transition">
                            <i class="fa-solid fa-arrow-right-from-bracket mr-1"></i> Logout
                        </button>
                    </div>
                </nav>

                ${showUserSettingsModal ? `
                    <div class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl w-full max-w-md relative shadow-2xl">
                            <button onclick="showUserSettingsModal = false; render();" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
                            <h3 class="text-xl font-bold text-white mb-1">Account Settings</h3>
                            <form onsubmit="handleUserPasswordChange(event)" class="space-y-4 mt-4">
                                <div><label class="block text-xs text-slate-400 mb-1">Current Password</label><input type="password" id="settings-current-pass" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-white text-xs"></div>
                                <div><label class="block text-xs text-slate-400 mb-1">New Password</label><input type="password" id="settings-new-pass" required class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-white text-xs"></div>
                                <button type="submit" class="w-full bg-indigo-600 text-white text-xs font-bold py-2.5 rounded-lg">Save Password</button>
                            </form>
                        </div>
                    </div>
                ` : ''}
            `;
        }

        function renderMailbox() {
            const notifs = currentUser.notifications || [];
            const isAdmin = currentUser.role === 'admin' || currentUser.role === 'co-admin';
            const backDest = isAdmin ? 'admin_home' : 'reader_home';
            const activeNotif = notifs.find(n => n.id === openedNotificationId);

            return `
                ${renderNavbar()}
                <div class="flex-1 max-w-3xl w-full mx-auto px-6 py-8">
                    <button onclick="navigate('${backDest}')" class="text-sm text-indigo-400 hover:underline mb-6 inline-block">← Back</button>
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 mb-6">
                        <h1 class="text-2xl font-bold text-white">Mailbox & Notifications</h1>
                    </div>

                    ${activeNotif ? `
                        <div class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div class="bg-slate-900 border border-indigo-500/50 p-6 rounded-2xl w-full max-w-lg relative shadow-2xl">
                                <button onclick="openedNotificationId = null; render();" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
                                <h3 class="text-xl font-bold text-white mb-4">${activeNotif.title}</h3>
                                <div class="bg-slate-950 p-4 rounded-xl text-slate-200 text-sm whitespace-pre-line mb-4">${activeNotif.text}</div>
                                <button onclick="openedNotificationId = null; render();" class="bg-indigo-600 text-white text-xs px-4 py-2 rounded-lg">Close</button>
                            </div>
                        </div>
                    ` : ''}

                    <div class="space-y-3">
                        ${notifs.map(n => `
                            <div onclick="openNotificationModal('${n.id}')" class="bg-slate-900 border ${n.read ? 'border-slate-800' : 'border-indigo-500'} p-4 rounded-xl cursor-pointer">
                                <h4 class="text-sm font-bold text-white">${n.title}</h4>
                                <p class="text-xs text-slate-300 mt-1 line-clamp-1">${n.text}</p>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderLogin() {
            return `
                <div class="flex-1 flex items-center justify-center p-6 bg-gradient-to-br from-slate-950 via-slate-900 to-indigo-950 w-full">
                    <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl w-full max-w-md shadow-2xl text-center">
                        <i class="fa-solid fa-book-sparkles text-indigo-500 text-4xl mb-2"></i>
                        <h1 class="text-2xl font-bold text-white mb-1">NovelVerse</h1>
                        <p class="text-xs text-slate-400 mb-6">Sign in securely with your Google Account</p>

                        <!-- SECURE GOOGLE SIGN IN BUTTON -->
                        <button type="button" onclick="handleGoogleLogin()" class="w-full bg-white hover:bg-slate-100 text-slate-900 font-bold py-3 px-4 rounded-xl transition flex items-center justify-center space-x-3 shadow-lg mb-6">
                            <i class="fa-brands fa-google text-red-500 text-lg"></i>
                            <span class="text-sm">Sign in with Google</span>
                        </button>

                        <div class="relative flex py-2 items-center mb-6">
                            <div class="flex-grow border-t border-slate-800"></div>
                            <span class="flex-shrink mx-4 text-slate-500 text-[10px] uppercase font-bold">Admin Portal</span>
                            <div class="flex-grow border-t border-slate-800"></div>
                        </div>

                        <form onsubmit="handleLogin(event)" class="space-y-3 text-left">
                            <div><label class="block text-xs text-slate-400 mb-1">Admin User ID</label><input type="text" id="login-email" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-white text-xs"></div>
                            <div><label class="block text-xs text-slate-400 mb-1">Password</label><input type="password" id="login-password" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-white text-xs"></div>
                            <button type="submit" class="w-full bg-slate-800 text-slate-300 py-2 rounded-lg text-xs font-bold">Admin Login</button>
                        </form>
                    </div>
                </div>
            `;
        }

        function renderRoleSelect() {
            return `
                <div class="flex-1 flex items-center justify-center p-6 bg-slate-950 w-full">
                    <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl w-full max-w-md text-center">
                        <h1 class="text-2xl font-bold text-white mb-6">Welcome, ${currentUser.name}!</h1>
                        <div class="grid grid-cols-2 gap-4">
                            <button onclick="navigate('reader_home', 'reader')" class="p-4 bg-slate-950 border border-slate-800 rounded-xl text-white font-bold">Reader</button>
                            <button onclick="navigate('author_home', 'author')" class="p-4 bg-slate-950 border border-slate-800 rounded-xl text-white font-bold">Author</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderReaderHome() {
            const novels = getStoredData('novels', []);
            const isAdmin = currentUser && currentUser.role === 'admin';
            const filtered = novels.filter(n => n.title.toLowerCase().includes(readerNovelSearchQuery.toLowerCase()));

            return `
                ${renderNavbar()}
                <div class="flex-1 max-w-6xl w-full mx-auto px-6 py-8">
                    ${isAdmin ? `<button onclick="navigate('admin_home')" class="bg-indigo-600 text-white text-xs font-bold px-4 py-2 rounded-lg mb-6">← Admin Dashboard</button>` : ''}
                    <div class="flex justify-between items-center mb-8">
                        <h1 class="text-3xl font-bold text-white">Explore Novels</h1>
                        <input type="text" value="${readerNovelSearchQuery}" oninput="readerNovelSearchQuery = this.value; render();" placeholder="Search..." class="bg-slate-900 border border-slate-800 rounded-xl px-4 py-2 text-sm text-white w-64">
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-6">
                        ${filtered.map(novel => `
                            <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden cursor-pointer" onclick="selectedNovelId = '${novel.id}'; navigate('reader_novel');">
                                <img src="${novel.cover}" class="h-48 w-full object-cover">
                                <div class="p-4"><h3 class="font-bold text-white">${novel.title}</h3><p class="text-xs text-slate-400">By ${novel.authorName}</p></div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderReaderNovel() {
            const novels = getStoredData('novels', []);
            const novel = novels.find(n => n.id === selectedNovelId);
            if (!novel) return renderReaderHome();

            return `
                ${renderNavbar()}
                <div class="flex-1 max-w-4xl w-full mx-auto px-6 py-8">
                    <button onclick="navigate('reader_home')" class="text-sm text-indigo-400 mb-6 inline-block">← Back</button>
                    <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl flex gap-6 mb-8">
                        <img src="${novel.cover}" class="w-48 h-64 object-cover rounded-xl">
                        <div>
                            <h1 class="text-3xl font-bold text-white">${novel.title}</h1>
                            <p class="text-sm text-slate-400 mt-1">Author: ${novel.authorName}</p>
                            <p class="text-slate-300 text-sm mt-4">${novel.synopsis}</p>
                        </div>
                    </div>
                    <h2 class="text-xl font-bold text-white mb-4">Chapters</h2>
                    <div class="space-y-3">
                        ${(novel.chapters || []).map((ch, idx) => `
                            <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl cursor-pointer text-slate-200" onclick="selectedChapterId = '${ch.id}'; navigate('reader_read');">
                                Chapter ${idx + 1}: ${ch.title}
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderReaderRead() {
            const novels = getStoredData('novels', []);
            const novel = novels.find(n => n.id === selectedNovelId);
            if (!novel) return renderReaderHome();
            const chapter = (novel.chapters || []).find(ch => ch.id === selectedChapterId);
            if (!chapter) return renderReaderNovel();

            const comments = getStoredData('comments', []).filter(c => c.chapterId === chapter.id);

            return `
                ${renderNavbar()}
                <div class="flex-1 max-w-3xl w-full mx-auto px-6 py-8">
                    <button onclick="navigate('reader_novel')" class="text-sm text-indigo-400 mb-6 inline-block">← Back</button>
                    <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl mb-6">
                        <h1 class="text-2xl font-bold text-white mb-6">${chapter.title}</h1>
                        <div class="text-slate-300 leading-loose whitespace-pre-line">${chapter.content}</div>
                    </div>
                    <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl">
                        <h3 class="text-lg font-bold text-white mb-4">Comments</h3>
                        <form onsubmit="postComment(event)" class="mb-6 space-y-3">
                            <textarea id="comment-text" rows="2" required class="w-full bg-slate-950 border border-slate-800 p-3 rounded-lg text-white text-sm" placeholder="Leave a comment..."></textarea>
                            <button type="submit" class="bg-indigo-600 text-white text-xs px-4 py-2 rounded-lg">Post</button>
                        </form>
                        <div class="space-y-3">
                            ${comments.map(c => `
                                <div class="bg-slate-950 border border-slate-800 p-3 rounded-xl">
                                    <span class="text-xs font-bold text-indigo-300">${c.userName}</span>
                                    <p class="text-xs text-slate-300 mt-1">${c.text}</p>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderAuthorHome() {
            const novels = getStoredData('novels', []).filter(n => n.authorId === currentUser.id);
            return `
                ${renderNavbar()}
                <div class="flex-1 max-w-6xl w-full mx-auto px-6 py-8">
                    <h1 class="text-3xl font-bold text-white mb-6">Author Studio</h1>
                    <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl mb-8">
                        <h2 class="text-lg font-bold text-white mb-4">Publish New Novel</h2>
                        <form onsubmit="createNovel(event)" class="space-y-4">
                            <div class="grid grid-cols-2 gap-4">
                                <input type="text" id="novel-title" required placeholder="Title" class="bg-slate-950 border border-slate-800 p-2 rounded text-white text-xs">
                                <input type="text" id="novel-genre" required placeholder="Genre" class="bg-slate-950 border border-slate-800 p-2 rounded text-white text-xs">
                            </div>
                            <input type="url" id="novel-cover" placeholder="Cover Image URL" class="w-full bg-slate-950 border border-slate-800 p-2 rounded text-white text-xs">
                            <textarea id="novel-synopsis" rows="3" required placeholder="Synopsis" class="w-full bg-slate-950 border border-slate-800 p-2 rounded text-white text-xs"></textarea>
                            <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded text-xs font-bold">Publish</button>
                        </form>
                    </div>
                    <div class="grid grid-cols-2 gap-6">
                        ${novels.map(n => `
                            <div class="bg-slate-900 border border-slate-800 p-6 rounded-xl flex justify-between items-center">
                                <div><h3 class="font-bold text-white">${n.title}</h3><span class="text-xs text-slate-400">${(n.chapters || []).length} Chapters</span></div>
                                <button onclick="editingNovelId = '${n.id}'; navigate('author_edit');" class="text-xs bg-indigo-950 text-indigo-300 px-3 py-2 rounded">Edit</button>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderAuthorEdit() {
            const novel = getStoredData('novels', []).find(n => n.id === editingNovelId);
            if (!novel) return renderAuthorHome();
            return `
                ${renderNavbar()}
                <div class="flex-1 max-w-4xl w-full mx-auto px-6 py-8">
                    <button onclick="navigate('author_home')" class="text-sm text-indigo-400 mb-6 inline-block">← Back</button>
                    <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl">
                        <h2 class="text-lg font-bold text-white mb-4">Add Chapter to ${novel.title}</h2>
                        <form onsubmit="addChapter(event)" class="space-y-4">
                            <input type="text" id="ch-title" required placeholder="Chapter Title" class="w-full bg-slate-950 border border-slate-800 p-2 rounded text-white text-xs">
                            <textarea id="ch-content" rows="8" required placeholder="Content" class="w-full bg-slate-950 border border-slate-800 p-2 rounded text-white text-xs"></textarea>
                            <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded text-xs font-bold">Publish Chapter</button>
                        </form>
                    </div>
                </div>
            `;
        }

        function renderAdminHome() {
            const users = getStoredData('users', []).filter(u => u.role !== 'admin');
            const novels = getStoredData('novels', []);
            const reports = getStoredData('reports', []);
            return `
                ${renderNavbar()}
                <div class="flex-1 max-w-6xl w-full mx-auto px-6 py-8">
                    <h1 class="text-3xl font-bold text-white mb-6">Admin Dashboard</h1>
                    <div class="grid grid-cols-3 gap-6 mb-8">
                        <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800"><span class="text-xs text-slate-400">Users</span><h3 class="text-2xl font-bold text-white">${users.length}</h3></div>
                        <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800"><span class="text-xs text-slate-400">Novels</span><h3 class="text-2xl font-bold text-white">${novels.length}</h3></div>
                        <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800"><span class="text-xs text-slate-400">Reports</span><h3 class="text-2xl font-bold text-red-400">${reports.length}</h3></div>
                    </div>
                    <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800">
                        <h2 class="text-lg font-bold text-white mb-4">User Management</h2>
                        <div class="space-y-3">
                            ${users.map(u => `
                                <div class="bg-slate-950 p-4 rounded-xl flex justify-between items-center border border-slate-800">
                                    <div><p class="text-sm font-bold text-white">${u.name}</p><p class="text-xs text-slate-400">${u.email}</p></div>
                                    <button onclick="deleteUserCompletely('${u.id}')" class="bg-red-950 text-red-400 text-xs px-3 py-1.5 rounded">Delete</button>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        async function init() {
            await fetchCloudData();
            render();
        }
        init();
    </script>
</body>
</html>
